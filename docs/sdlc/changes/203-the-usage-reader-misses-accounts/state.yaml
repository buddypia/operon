# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/203-the-usage-reader-misses-accounts.
#
# Report: change 202's reading of the open records (triage.md there, A1-A3).
#
# A1. install_claude_hooks kept one "installed once" marker beside the hook
#     scripts for every Claude folder, wrote it whatever the slot held, before
#     the settings file, and never removed it. So the reader went into the
#     machine's own folder and no registered account's; turning hooks off and
#     on (or claude missing from PATH for one launch) lost it for good; and a
#     slot that held somebody else's command was marked as if Operon had been
#     there. Reproduced by the_usage_reader_reaches_every_account_and_survives_a_toggle
#     (second account: no reader).
# A2. The status-line throttle compared the CLI's elapsed time with a stamp
#     kept per pane; a new CLI in the same pane starts from zero, so it posted
#     nothing for as long as the last one had run. Reproduced by a fourth post
#     at 500 ms in the_installed_usage_reader_posts_a_reading_end_to_end.
# A3. A registered account whose folder is gone was skipped at install with
#     nothing said; change 031's spec names it in the hook status list.
#
# Fix: one marker per settings file (a digest of its path), written only after
# the file is, only when the reader is seen in the slot, and removed when
# Operon removes the reader itself; the shared marker becomes the machine's
# own folder's once. A clock behind the stamp posts. The install carries one
# notice per missing account, drawn beside the hook verdict.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Four remarks are carried in review.yaml; none needs anything
  from the person. Closed in the same commit that CI judges last."

contract:
  failing-test-first: "machine passed both new assertions failed on the code as
    it was (no reader in the second account; no post after a restart);
    mutations.py here caught 7 of 7"
  three-gates: "machine passed cargo fmt, clippy and the named tests; the
    suite runs in CI"
  ci: "machine passed on the tip, which the merge gate checks"
  release-binary: "machine passed yes: src/tmux/hooks.rs, src/app/screens.rs and
    src/config.rs; the installed app is rebuilt from main after the changes
    that follow 202"
  review: "human passed rust-reviewer approve-with-nits 0 3 and
    durability-reviewer approve-with-nits 0 3 at d1ae4bb789016b8a (round 1),
    four remarks carried in review.yaml"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
