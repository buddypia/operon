# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# A handoff bundle drops every tool result, and a tool result or reasoning
# passage with a blank line leaks its later paragraphs into the excerpt as
# conversation. The person chose shortened tool results over dropped ones.
#
# Risk: src/history.rs is the foreign-store surface (medium, supervised);
# src/config.rs, src/tests.rs, and the READMEs match nothing higher. The
# bundle is text handed to an agent, not a screen: screen n/a.

state:
  route: "modify"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Done once landed and shipped: one reviewer finding carried in review.yaml, typed text after a tool result in one message crossing inside the tool section."

contract:
  live-restore: "machine passed cargo test --locked -- --ignored: 6 of 6"
  failing-test-first: "machine passed the four tests the spec names failed on
    main's builder: no tool-result section, the leaked second paragraph, the
    unshortened stub, and a tool result giving way before an older turn"
  three-gates: "machine passed make q.fast (cargo fmt --check · cargo clippy
    --locked -D warnings) clean; cargo test --locked handoff and the new tests
    23 ok; the suite runs in CI on the push"
  bands: "machine passed bash scripts/check-bands.sh: 20 of 21 within band;
    largest_module_lines warns at 8856 for src/app.rs, untouched here (warn:
    recorded, no action)"
  review: "human passed round 2 at 3841f789f1e32106: rust-reviewer
    approve-with-nits 0 1, one nit carried"
  release-binary: "machine passed yes: touches src/history.rs and src/config.rs;
    package /Applications/Operon.app from main after merge with
    bash scripts/package-macos.sh and the ship skill's swap"
  guards-verified-by-mutation: "human passed 15 of 15 caught by mutations.py in
    this directory: results dropped, more than three, newest first, repeats not
    collapsed, signal lines ignored, the latest signal giving way first,
    omissions counted by collapsed line, long lines not cut, a tool paragraph
    leaking as said text, older turns outranking results, the newest result
    giving way first, the last-resort cut ignoring its marker, and three claims (the heading's snapshot pointer, the
    omission note's author, the README's count); tree restored"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
