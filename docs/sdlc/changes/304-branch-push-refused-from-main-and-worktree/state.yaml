# Change 304. Bug report, as the bugfix route takes it in place of an intent:
#
# A session whose Bash working directory cannot persist between calls (Claude
# Code's CLAUDE_BASH_MAINTAIN_PROJECT_WORKING_DIR=1, which a person may set or
# inherit from a parent process) and that starts in the main checkout has no
# spelling of a branch push that both Bash guards admit:
#  1. `git push -u origin fix/x` from the main checkout is refused by the trunk
#     allowlist (.claude/config/worktree-policy.json#trunk_bash_allowlist,
#     which admitted only `git push origin main`); its refusal points at
#     `cd <worktree> && …` or `git -C <worktree> …`.
#  2. `cd <worktree> && git push …` and `git -C <worktree> push …` are refused
#     by the Publishing gate in .claude/hooks/guard-bash.sh (nothing joined,
#     nothing before `push`).
# Each refusal points at a form the other refuses. Observed 2026-11-16 in
# change 301's session (transcript 742dd4d0-1056-4664-bb87-0bf8c4642161): the
# session then pushed from a script file, which no guard reads. Measured: of
# the Bash hooks only the trunk allowlist refuses a plain branch push from main
# (guard-bash.sh, gate-merge.sh, commit-guard, destructive-git-guard and
# worktree-session-owner-guard all pass it). sdlc 084: a recoverable step a
# guard refuses is a gap in the guard.
#
# Reproduce: the trunk allowlist judges `git push -u origin feature/x` on a
# trunk fixture; it is denied.
#
# Decision (person, option A; see approvals.log): the trunk allowlist admits
# the Publishing gate's plain push for any branch, with the same character set
# as guard-bash.sh's plain_push. Rejected: B, the Publishing gate admitting
# `git -C <worktree> push` (widens the gate every session goes through); C, no
# guard change and delegation discipline only (leaves the dead end in place).
# Why it is safe: a push only uploads a ref and does not touch the main
# checkout's working tree; there is no pre-push hook (.git/hooks holds only
# reference-transaction); the same push is already admitted from any worktree;
# the Publishing gate still refuses every non-plain push (force, refspecs,
# another remote, redirects, chains).

