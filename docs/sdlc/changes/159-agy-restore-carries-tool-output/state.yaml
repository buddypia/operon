# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: an `agy --conversation=f5dfbf48-…` conversation restored into Claude
# Code showed agy's tool output — `[diff_block_end]`, "Please note that the
# above snippet only shows the MODIFIED lines…" — as the last thing Claude had
# said. (The same report's Codex failure, `respawn pane failed: fork failed:
# Device not configured`, is a different cause in src/tmux.rs: change 160.)
#
# Cause (root-cause skill): `antigravity_transcript_record` (src/history.rs)
# pushes a record's `content` unmarked. For `MODEL/GENERIC` — what agy's tools
# returned, 82 of the 165 records in the reported transcript — that content
# also carries agy's instructions to its own model ("If relevant, proactively
# run terminal commands … Don't ask for permission."). Claude's `tool_result`
# and Codex's `function_call_output` cross as `[Tool result]\n…`; agy's crossed
# bare, so the destination read tool output and agy's harness text as its own
# words. Verified against the imported conversation
# c3654885-9ecc-4f79-b759-d9ec9dab4ef4.jsonl: 157 assistant turns, the last one
# a bare replace_file_content result.

