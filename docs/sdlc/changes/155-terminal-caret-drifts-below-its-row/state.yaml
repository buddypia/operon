# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Cause (root-cause skill): the pane draws tmux's cursor with
# `terminal_cursor_rect` (src/ui/terminal.rs), which anchors the caret box at
# `(terminal_rect.min.y + 8) + cursor.y * cell.y` and `left + cursor.x * cell.x`
# — a coordinate system measured from the pane's viewport top. The capture's
# rows, however, are rendered inside a ScrollArea whose content is scrollback +
# the screen + one phantom trailing empty row (`terminal_line_layouts` splits a
# trailing '\n'), aligned to the viewport bottom by stick_to_bottom. Once the
# content is taller than the viewport the two anchors disagree by the scroll
# offset: the box lands one row low, and with real scrollback off the pane
# entirely. Verified against the user's session (tmux reports cursor (2,16);
# 0-based row 16 IS the `>` input row — tmux is right, the drawing is wrong).

