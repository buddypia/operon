# Review record for 155-terminal-caret-drifts-below-its-row.
#
# The change: three tmux fields (`cursor_x`/`cursor_y`/`pane_height`) are
# carried through `TerminalCursor` into the poll path, mapped into a buffer row
# by the pure `terminal_cursor_row`, and the caret box is computed inside
# `ScrollArea::show_rows` with the same screen coordinates the pre-existing
# search highlight uses. A row the pane scrolled out reports no caret — the
# box surfaces only on a cell this frame actually drew.
#
# Verified by rust-reviewer against .claude/rules/rust.md across three rounds:
# - Per-frame work: parse stays at poll time (set_session_output), nothing new
#   in the draw path; caret/fallback are arithmetic on rects.
# - No new panic sites: all new error paths `ok_or_else` + `?`; the `#[cfg(test)]`
#   probe and its caller are consistent across test and non-test builds.
# - egui 0.31 semantics of `show_rows` verified against the pinned crate's
#   source: rows start at floor(offset/row_height), child ui at content origin,
#   so `ui.cursor().top()` is the first visible row's origin and the caret
#   anchor shares the highlight's reference frame exactly.
# - Round 1 nits, both acted on: the IME rect/underlay now use
#   `caret.unwrap_or(fallback)` (composition anchors on the true caret whenever
#   its row is visible) — round-2 and round-3 spot-verified; and a doc comment on
#   `terminal_cursor_row` rewritten twice until it matched the actual runners
#   (`run_command_with_timeout` errors on truncation, so a short capture is
#   never built; `read_stream_limited` keeps the head).
# - Round-1 nit 2 (no box on a partially-filled pane) was measured rather than
#   taken: against a holdaway tmux 3.8 socket a fresh 20-row pane captures
#   exactly 20 lines and keeps growing with the buffer, so a normal capture
#   always covers the grid; a short body means a producer that did not build the
#   capture the recorded path builds, and `None` stays the defensible answer.
#   The doc comment records the measurement.
# - Renamed test `parses_tmux_cursor_line_needs_all_three_fields` verified.
#
# Verified by durability-reviewer against
# .claude/skills/durability-invariants/SKILL.md:
# - No store/migration/packaging touch; `TerminalCursor` is not persisted;
#   `terminal_cursors` stays one small entry per session, retired at the
#   pre-existing session teardown beside `terminal_layouts`.
# -tmux capture range `-S -5000`, byte budget, and stop/retry logic unchanged;
#   a parse failure degrades to no cursor, not a crash.
# - Final delta (one doc comment) verified against the actual
#   run_command_with_output_limit / run_command_with_timeout behavior.
#
# Verified by subprocess-safety-reviewer against its agent rubric:
# - Same tmux_command()/PATH handling as before; the marker arg is pushed as a
#   `.args()` element, no shell interpolation.
# - No new `Command::new`/`.spawn`/`.output`/`unsafe`/`set_var` sites anywhere
#   in the diff (grep over the staged diff, plus keyword sweep).
# - `parse_tmux_cursor_line` bounded to one line; u16 parse failure degrades to
#   `cursor: None` with the same fallback as pre-existing parse failures.

