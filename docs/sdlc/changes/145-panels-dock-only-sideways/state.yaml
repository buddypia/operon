# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: modify — the side panel's drag exists and moves the wrong thing.
# Screen: the change paints (risk.yaml `drawing`, screen yes); the layout is
# re-arranged, so a person approved it (2026-10-13).

state:
  route: "modify"
  stage: "test"
  status: "reviewing"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Push the branch, wait for CI, merge into main, then package and install."

contract:
  three-gates: "machine passed bash .claude/hooks/gate-commit.sh at the change commit (fmt, clippy, test count 779 -> 787, no new ignore)"
  bands: "machine passed bash scripts/check-bands.sh exit 0; 4 pre-existing breaches, largest_module_lines fell 8856 -> 8843"
  release-binary: "machine pending yes: touches src/ui, src/app, src/app.rs, src/config.rs, src/i18n_tables.rs; ends with bash scripts/package-macos.sh"
  guards-verified-by-mutation: "human passed the ten dock tests were run against stub bodies and all ten failed before the model was filled in"
