# Change 313. After seeing change 312's page, the person wrote (2026-11-19):
# 「画面構成のUI/UXもわからないし、人間がレビューし、AIがSPECとかBRIEFと進捗が追える
# 文章とかもない。これで人間が全体像を掴めないし、レビューもできないし、開発の進捗も
# 追えない」. 312 answered with a change-centric ticket view; this change adds the
# product view: feature documents (BRIEF for a person, SPEC for an AI), a
# feature-first page, and the process rules that keep the documents true.
#
# Decisions taken by the managing session, not by the person (recorded as such):
# the person was asked and did not answer within ten minutes, so the recommended
# defaults were adopted: (1) docs/features/ holds the living documents, reversing
# feature-pilot's "no feature folder" line for the one fact it did not hold, what
# the product does now; (2) the page becomes feature-first and the change list is
# its second tab; (3) each change from 313 on names its features in state.yaml.
# A revert undoes all three. The person approved them and the landing with
# 「進めて」 on 2026-11-19 (approvals.log).

