# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: the seven findings change 176 carried. Three are tests that pass with
# what they guard deleted: runAdapter's skipsAntigravityRun call and
# buildCliEmission's empty-answer check can go and every test stays green, and
# the refusal test accepts the 'Blocked by repository policy.' fallback in place
# of the guard's own reason. Two are one fixture: the refusal test asserts
# before it removes its directory. The last three rest on agy behaviour nobody
# had measured: whether a PreToolUse advisory has any shape, whether
# executionNum restarts at 0 on a later turn, and whether a cancelled Stop
# should run a blocking guard.
#
# Measured against agy 1.4.0 in an isolated workspace (2026-10-18, probe hooks
# only): a PreToolUse answer carrying only `reason` denies the call ("denied by
# pre-tool hook: <reason>"); `{decision: "allow", reason}` and
# `{allow_tool: true, ...}` run it and the agent sees no reason. So an advisory
# has no shape that neither blocks nor approves without asking, and Claude Code
# gives an `allow` reason only to its debug log (hooks reference, decision
# control table). A first Stop is executionNum 0, the Stop after a `continue`
# is 1, and the first Stop of the next turn in the same conversation is 0
# again. Claude Code's Stop "does not run if the stoppage occurred due to a
# user interrupt", so the USER_CANCELED skip is the contract every Stop guard
# here is written against, blocking or not.
#
# Fix: tests only, and the measurements written where the code relies on them.
# No behaviour changes.
#
# Risk: .cli/ is gate-configuration (high, paused). The .cli edit is comments;
# the reviewers' split decides whether any of it is the person's.

