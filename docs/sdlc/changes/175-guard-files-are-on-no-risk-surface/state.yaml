# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: change 173 widened the trunk allowlist and found that
# docs/sdlc/risk.yaml classifies neither .claude/config/ nor .cli/hooks/; it
# asked the person, who answered on 2026-10-18: 「リスク分類もよくわからない。業界
# 標準やベストプラクティスでやって」. Measured: the guards all three CLIs register,
# the policy they read, the other two CLIs' hook registrations, the two scripts
# the merge and stage gates delegate to, and the CI the merge gate trusts are on
# no surface.
#
# Route modify: an existing classification changes; no behaviour a user sees.
# risk.yaml is gate configuration (high, paused). The edit only adds paths —
# tightening, which approval.md hands to the evaluator; the person's instruction
# is recorded beside it.

state:
  route: "modify"
  stage: "test"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "paused"
  risk: "high"
  readiness: "go"
  screen: "n/a"

resume: "Done. Reviewed at round 2; the open nits are carried in review.yaml."

contract:
  failing-test-first: "machine passed
    every_hook_an_agent_cli_runs_is_gate_configuration failed on main's table
    naming .claude/hooks.json, .codex/hooks.json, .cli/_cli-dispatch.mjs and the
    six .cli/hooks guards from each registration that runs them; after review
    round 1 it follows the guards' relative imports and failed again on the 19
    .claude/scripts/lib files they reach; passes with the row extended"
  three-gates: "machine passed make q.fast (cargo fmt --check · cargo clippy
    --locked -D warnings) · the risk, route and review-gate tests (14 passed);
    the suite runs in CI"
  release-binary: "machine waived touches docs/sdlc/risk.yaml and src/tests.rs
    only; the installed app is not built from either"
  review: "human passed rust-reviewer approve-with-nits 0 5 ·
    subprocess-safety-reviewer approve-with-nits 0 3, round 2"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
