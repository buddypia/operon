# The state of one change. Copy into a change directory beside intent.md.
#
# This is the file a session arriving cold reads first. Before it existed, a
# session opened three prose documents and inferred where the work stood, which
# is why change 007 was written in one sitting: there was no way to hand it over.
#
# This is flat and positional for the same reason docs/sdlc/bands.yaml and
# docs/sdlc/routes.yaml are: a file that cannot drift from its parser needs no
# repair tool.
#
# `every_state_file_names_a_route_and_a_stage_that_exist` in src/tests.rs reads
# the closed sets below out of THIS file and checks every change's state against
# them, so widening a set is a one-line diff here and nowhere else.
#
#   status  — where the change is. The four that are not progress matter most:
#             a session that stops without recording one is indistinguishable
#             from a session that finished.
#
#             planning      stages 1-2, artifacts being written
#             ready         readiness gate returned Go; stage 3 may begin
#             in-progress   stage 3-4, code and tests being written
#             reviewing     stage 5, awaiting the review passes
#             done          closed, guards in place, lesson recorded if needed
#             awaiting-user the question ceiling was reached, or the risk tier is
#                           paused. Assumptions adopted are listed in resume.
#             blocked       a question nothing in the repository can answer
#             failed        the route's attempt ceiling was spent; handoff.md written
#             archived      abandoned or superseded; not resumable, start a new one
#
#   stage   — one of the six in docs/sdlc/README.md: plan design build test deploy maintain
#   route   — one of the routes in docs/sdlc/routes.yaml
#   attempts / questions — "<spent> <ceiling>". The attempt ceiling comes from the
#             route; the question ceiling is seven: at seven, stop
#             asking, adopt the recommended default, and record it in resume.
#   autonomy — full | supervised | paused, from the risk tier in docs/sdlc/risk.yaml
#   risk     — high | medium | low, from docs/sdlc/risk.yaml
#   readiness — go | conditional | no-go | pending, from scripts/check-readiness.sh
#   screen   — approved | pending | n/a. Not n/a when the change touches a
#              `screen yes` surface in docs/sdlc/risk.yaml.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "conditional"
  screen: "approved"

# One sentence, for a session that has just arrived and read nothing else. What
# to do next — not what happened. If it needs a semicolon it is too long.
#
# Cause (root-cause, measured in change 166's grid test): `egui::Frame` places
# itself with `allocate_rect` at the cursor, so a card in `horizontal_wrapped`
# never wraps. Each card's content `ui` gets the rest of the row as its
# max_rect, and the `right_to_left` layouts inside fill it — the first card is
# the whole row wide, the second starts at the row's end with its 205px minimum,
# and the history's scroll area grows to 1120px in a 900px view. Every later
# project header is laid out in that widened area.
resume: "Done; the installed app is rebuilt by the session that lands this, and what outlives it is the three carried review points in review.yaml."

# What "done" means for this change, and what decides it. A `machine` item names
# a command; `.claude/hooks/gate-stop.sh` refuses a finish while one is pending.
# A `human` item names an observation a person makes.
#
#   <kind> <verdict> <what decides it>
#
#   kind     machine | human
#   verdict  pending | passed | waived
#
# `release-binary` is here rather than left to the end because the answer is
# knowable on the first day: whether the installed application goes stale is
# decided by what the change touches, not by what the diff turns out to be.
# Twice in a row it was "no" by luck; the third time it was "yes" and surfaced
# only when the release gate refused. `src/tests.rs` is behind `#[cfg(test)]`
# and is not a release-binary source; `bash scripts/check-installed-build.sh`
# is what says whether the bundle on this machine is behind.
contract:
  failing-test-first: "machine passed the_session_grid_keeps_every_card_inside_its_view fails on each pre-fix form mutations.py restores — cards unbounded, path untruncated, title untruncated"
  three-gates: "machine passed bash .claude/hooks/gate-commit.sh admitted the closing commit (fmt, clippy, review gate)"
  bands: "machine passed bash scripts/check-bands.sh — 21 metrics within their bands"
  release-binary: "machine passed src/app/screens.rs changes, so the installed app goes stale; the release after this lands is the coordinating session's"
  named-tests: "machine passed cargo test --locked the_session_grid_keeps an_empty_project_in_the a_project_emptied_by_pinning every_ — 87 passed"
  guards-verified-by-mutation: "human passed mutations.py: 7 of 7 caught, including cards offered no height and cards that do not wrap"

# The closed sets, written once. `every_state_file_names_a_route_and_a_stage_that_
# exist` reads them out of this block rather than restating them, so widening a
# set is a one-line diff here and the guard follows — lesson 004, which is about a
# guard that retyped the value it guarded and went blind on the rename it existed
# to survive. `stage` and `route` are not here: they belong to
# docs/sdlc/README.md and docs/sdlc/routes.yaml, and the guard reads them there.
sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
