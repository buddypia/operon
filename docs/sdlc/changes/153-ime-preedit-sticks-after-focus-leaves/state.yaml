# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Cause (root-cause skill): ui_terminal_panel wrote terminal_preedits only in
# frames where the pane held the keyboard, and drew and read it in every frame.
# When focus left mid-conversion the event that ended the composition landed in
# an unfocused frame and was dropped, so the stale entry stayed: drawn over the
# terminal, and read back as is_preediting on refocus, which makes
# terminal_input_events swallow Backspace/arrows/Escape/Enter with no IME
# composition left to clear it. Separately, the pane claimed the IME with three
# send_viewport_cmd calls per focused frame; each requests a repaint (egui 0.31
# Context::send_viewport_cmd_to), so a focused terminal redrew every frame, and
# the commands bypassed egui-winit's allow_ime record, so leaving the pane never
# disallowed the IME again.

