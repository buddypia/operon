# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/209-what-was-approved-is-what-runs.
#
# Report: change 202's reading of the open records (triage.md there, A14 and
# A15), and change 208's review of the run script read.
#
# A14. is_safe_ref_name, which guards the branch the land merges, was a
#      hand-written subset of git's rules: `a~1`, `a@{1}`, `a^`, `a:b` and
#      control characters passed it and git would read them as revisions. The
#      checkpoint id check accepted any run of hex digits, the empty one too.
# A15. An approved setup or run script ran as `bash <the repository's file>`,
#      so what bash read was whatever the file held by then, and bash reads a
#      script as it runs. A restarted run-script session ran the file again
#      with no check at all. From 208: the read checked the size, then read
#      the whole file, so a file that grew in between was read past the cap.
#
# Fix: is_safe_ref_name asks git's own check-ref-format --branch, as a new
# worktree's branch already does, and refuses `@`, which git allows and reads
# as HEAD. is_commit_id takes a whole object id (40 or 64 hex digits), and
# its refusal goes through tr. Scripts are read once, bounded by the ceiling
# itself, and SetupScript carries the bytes its digest was taken over.
# keep_approved_script writes those bytes beside the store under their
# digest, and setup_command sources that copy from a bash whose $0 is the
# repository's path, with no arguments left over, so a script that finds its
# folder from $0 behaves as before. Both buttons build the command through
# approved_script_command, and a restart runs the same copy.
#
# Decided: a script that finds its folder from BASH_SOURCE now finds the copy's
# folder. Keeping it too would mean leaving the copy inside the repository,
# where the thing it guards against can change it; $0 is the common idiom and
# is kept, and the manuals say where the copy lives and name the
# `[[ ${BASH_SOURCE[0]} == $0 ]]` guard that no longer runs.
#
# From the first review: the copy's directory is made absolute, since the pane
# changes into the worktree first and a relative data directory (no home) would
# name a file the repository holds; the directory is private, as the shared
# archive's is; a failed copy says which path; the read opens without waiting
# and checks the handle, so a FIFO swapped in never stalls the window; and a
# copy that cannot be kept runs nothing. Refusing `@{` before git was tried and
# taken out: git, asked from `/`, refuses it already, and no test could tell
# the two apart.
#
# From the second review: the notice carries the reason as well as the path; a
# bare file name keeps the current directory as its folder; the manuals say a
# script that runs `bash "$0"` again runs the repository's file. Known and
# left: copies are not pruned (one per approved digest, each under the
# ceiling), and a restart re-runs the copy without hashing it again.
#
# Route: bugfix, not security. Both defects reproduce (a~1 passes the gate; a
# file edited after the check is what runs), triage.md is the report, and an
# intent and spec would restate its two rows. What the security route adds
# that matters here is its reviewers, and this change asks all three.

