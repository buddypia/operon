# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/214-a-sweep-starts-from-a-green-tree.
#
# Report: found while closing change 213. Its first mutation sweep printed
# "5 of 5 caught" while the test it ran was red on the unmutated tree (a merge
# in the fixture conflicted), because scripts/mutation_sweep.py never runs the
# checks without a mutation. The result was about to be recorded as evidence.
#
# Fix: the runner runs the checks once before any mutation and stops with
# SETUP FAILED unless they pass; rule 7 in its header, and the template says
# seven rules. The sweep tests' fixture checks now react only to the mutation,
# since a check that hangs or fails whatever the tree holds is now refused at
# the start, which is the point. Lesson 099.
#
# Decided: closed changes' mutations.py files are not edited. They call the
# runner, so a re-run of any of them now gets the baseline too.
#
# Route: bugfix. scripts/mutation_sweep.py is on no paused surface.

