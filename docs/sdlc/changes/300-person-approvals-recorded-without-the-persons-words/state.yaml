# Change 300. Bug report, as the bugfix route takes it in place of an intent:
#
# A `person` line in an approvals.log says a person approved an artifact, and
# the agent writes it. Nothing says what the line must hold, so each session
# improvised: some quote the person's reply, some quote the request the work
# started from, and some hold no words of the person at all ("existing
# explicit user authorization still applies", "Carried from the person's 08:46
# choice"). A line with no quote cannot be checked against what the person
# said, and an approval taken from a broad request is never shown back to the
# person, so they cannot see that their request was read as one. Changes 296
# and 297 recorded gate-configuration approvals that way, and the session
# could only mention it in passing.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "paused"
  risk: "high"
  readiness: "conditional"
  screen: "n/a"

resume: "Done. From change 300 on a person approval quotes the person, and an approval read from a request is reported back."

contract:
  three-gates: "machine passed fmt and clippy at commit; cargo test --locked approval 11 passed, stop_gate harness_documents every_state_file lesson 12 passed; full suite in CI"
  failing-test-first: "machine passed the_approval_checker_wants_the_persons_words_on_a_person_line failed on the unedited checker: 303-no-words passed"
  release-binary: "machine waived touches scripts/check-approvals.sh, .claude/skills, docs/sdlc and src/tests.rs only; none is in the bundle"
  guards-verified-by-mutation: "machine passed 11 of 11 caught: python3 docs/sdlc/changes/300-person-approvals-recorded-without-the-persons-words/mutations.py"

