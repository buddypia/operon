# Review record for 172-antigravity-cannot-find-a-restored-conversation.
#
# The change: a conversation restored into Antigravity is written the way agy
# writes its own — WAL journal, user_version 1 — so agy's stamp on open no
# longer waits on Gemini.app's hub, which reads every new conversation at once;
# a file SQLite leaves out of WAL fails the restore instead of reaching the
# store; failure paths remove the file's -wal and -shm with it.
#
# Round 1: rust-reviewer found the journal mode SQLite reported was discarded,
# so a file it could not put in WAL would have restored silently and brought
# the symptom back (Important), plus three nits. Round 2 returned the mode from
# the write, refused anything but `wal` through tf! (EN and KO rows added), and
# pinned it with an in-memory database, watched failing with the check off.
#
# Verified by rust-reviewer: the pragmas run in autocommit before the
# transaction; close() on the private temporary name checkpoints and removes
# its -wal before the rename; dropping either pragma fails the new test; the
# read-only verification's sidecars are the ones agy leaves while a
# conversation is open, and SQLite reinitialises them.

