    a_restored_antigravity_conversation_opens_while_another_process_reads_it
    failed with the old writer on `database is locked` — the error agy logged —
    and passes after; its WAL refusal failed with the check mutated off"
  live-restore: "machine passed cargo test --locked -- --ignored — 6/6 three
    runs in a row on the writer change; after review round 2, 4/6: both
    Antigravity-destination tests pass, and both Codex-destination tests stop
    on Codex's 'Hooks need review' prompt, because ~/.codex/hooks.json gained
    two device-guard.py hooks at 16:29 from outside this repository (diff
    against hooks.json.bak-device-guard-20261017). Trusting them is the
    person's decision; those tests do not reach the Antigravity writer"
  three-gates: "machine passed cargo fmt --check · cargo clippy --locked -D
    warnings · the restore, translation and harness tests; the suite runs in CI"
  bands: "machine passed bash scripts/check-bands.sh — 21 metrics within
    their bands"
  review: "human passed rust-reviewer approve 0 3 at bfa47004c03ad93c
    (round 2), remarks carried in review.yaml"

