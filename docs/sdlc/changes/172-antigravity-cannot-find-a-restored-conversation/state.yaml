# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: change 168 left one symptom unexplained — a conversation restored into
# Antigravity sometimes opens as "conversation … not found" and agy starts an
# empty one — and wrote "rerun it" into CLAUDE.md, calling it agy's lookup. Asked
# to finish the remaining work, the person got that note as a known limitation.
#
# Reproduced: with the person's Gemini.app running, 7 of 11 conversations
# written by import_full_history_into_antigravity and resumed at once were not
# found (agy 1.4.0). Cause, from agy's own log and the file headers: Operon wrote
# the file with a rollback journal and user_version 0; agy stamps user_version
# when it opens a trajectory file ("open backend …: set user_version: database
# is locked"); Gemini.app's hub (`agy --hub`, pid 29942 here) opens every new
# conversation the moment it appears and keeps it open, and a rollback-journal
# write waits on that reader. Files agy writes itself are WAL with user_version
# 1. Written that way, 13 of 13 were found, alternating with the old writer in
# the same minutes (5/5 against 1/5).
#
# Fix: build_antigravity_conversation stamps
# ANTIGRAVITY_TRAJECTORY_SCHEMA_VERSION and switches to WAL before the schema;
# the failure paths drop the file's -wal/-shm with it (sqlite_file_and_sidecars,
# also used by the live tests' cleanup). CLAUDE.md's "rerun it" is replaced, and
# the root-cause skill names the trap: a failure blamed on another product is a
# guess until reproduced (lesson 077, after 074 made the same point once).
#
# The conversations the probes wrote (25, ids recorded) were removed with their
# sidecars; their history index lines stay, as in change 168.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Rebuild and swap after the merge: restore into Antigravity
  changed for the person."

contract:
