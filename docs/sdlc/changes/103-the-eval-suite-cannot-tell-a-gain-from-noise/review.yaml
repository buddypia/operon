# start (test the_eval_runner_does_not_run_the_agent_when_the_check_cannot_be_hidden),
# and worktrees live in a mktemp directory under TMPDIR (asserted in the hiding
# test). mutations.py gained one mutation for each; 20 of 20 caught. Its nit 3,
# that infra can hide a steering-caused timeout, is answered in evals/README.md.
#
# Round 2, at digest eaaea34b86fe9916: both reviewers re-read the changes;
# no Important finding. The rest are carried below.

