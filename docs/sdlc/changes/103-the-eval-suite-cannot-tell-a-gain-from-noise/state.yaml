    clean, cargo test --locked 678 passed 0 failed 6 ignored after review round 1"
  bands: "machine waived unsafe_blocks propose and steering_bytes warn read the
    same on main before this change (3 and 239928); this change adds no unsafe
    and 224 steering bytes, so neither reading is this change's to answer"
  release-binary: "machine passed no: the change touches scripts/run-evals.sh,
    evals/, src/tests.rs and documents; src/tests.rs is behind cfg(test), so the
    installed application does not go stale"
  guards-verified-by-mutation: "human passed mutations.py beside this file, 20 of
    20 caught after review round 1 (18 of 18 twice before it)"
