# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Bug report (it is the intent on this route):
# Clicking `Read(~/dev/buddypia/example-webshop/.tmp/test-output.txt)` or other CLI tool outputs
# with Command (⌘) + click did not open the file.
# Root cause:
# 1. Tilde paths (`~/...`) were not expanded to HOME directory, causing worktree.join("~/...")
#    which failed canonicalization and returned None.
# 2. Paths formatted inside CLI tool calls (`Read(...)`, `Edit(...)`, `Write(...)`, `View(...)`)
#    did not treat the tool-call badge as an openable target span.
# 3. `file:///` URLs were not recognized as openable path targets.
# 4. External opening was constrained by project root checks in `open_terminal_target_external`.

