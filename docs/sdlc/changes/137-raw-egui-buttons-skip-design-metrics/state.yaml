# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Request: the person showed the cramped "パスを手入力" toggle and asked for
# consistent buttons and text, plus a mechanism (DESIGN.md and a guard) so an
# agent writing UI cannot repeat it.
#
# Cause (read from egui 0.31 Button::ui): `small_button` / `Button::small()` set
# button_padding.y to 0 and skip the interact_size.y (28px) minimum, so the
# button ignores apply_interface_metrics.

state:
  route: "modify"
  stage: "build"
  status: "in-progress"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "low"
  readiness: "go"
  screen: "pending"

resume: "Artifacts written; evaluator approval of intent/spec/screen/plan next, then the two failing tests, then the call sites."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  button-height-test: "machine pending cargo test --locked every_button_keeps_a_documented_height"
  type-scale-test: "machine pending cargo test --locked every_text_size_is_a_level_on_the_type_scale"
  design-md-matches-paint: "machine pending cargo test --locked design_md_documents_exactly_what_the_app_paints"
  release-binary: "machine pending touches src/, so ends with bash scripts/package-macos.sh"
  guards-verified-by-mutation: "human pending each new guard watched failing"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
