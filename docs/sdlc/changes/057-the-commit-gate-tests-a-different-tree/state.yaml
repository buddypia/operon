resume: "Done and committed. Change 056, which this change exists because of, landed as fe03d37 — and it landed because a person installed the two-hunk patch below into the running hook, which made the gate run cargo in this worktree instead of the shared checkout.

What outlived this change, for whoever reads it next. Three things.

One: 056's own state.yaml landed saying `status: blocked`, which it was when the file was written and was not when it was committed. Worth a one-line follow-up; it is the failure this pipeline's own README warns about, a state file that is read and believed.

Two: the two paused decisions change 054 left open are still open, and the running hook in the shared checkout is now a patched 503-line file that has never been committed — patched by hand, from ~/.operon-hook-backups/, by a person, because three separate guards correctly refuse a worktree-isolated session any write there. The tracked 94-line copy this change fixes is what a fresh clone gets. The two diverge in what they refuse about `-C`, and reconciling them is 054's decision rather than a rider on this one.

Three: `.claude/hooks/gate-stop.sh` carries the same wrong-tree defect this change fixed, described at the end of this file. Held by change 035.

And one observation that is not a task but should not be lost. The first commit attempt of this change was refused by its own gate — running, correctly, in this worktree, which is what says the fix works — with one failure: `caps_child_output_during_capture_instead_of_after_buffering`, at `assert!(started.elapsed() < Duration::from_secs(2))`. Not a defect in this change or 056, and measured rather than assumed: the test passes 5 of 5 alone in 0.03-0.04s against its 2s budget, a ~60x margin, at the same load average of 20-27 that the failure happened under; and the full suite passed 3 of 3 immediately after, 11 times in all across the day. What failed is a behavioural claim — that the cap happens during capture and not after buffering — checked through a wall-clock proxy, which is load-sensitive by construction when it runs as one of 480 tests in parallel while other sessions have the machine at load 20. The behavioural half of the test passed; only the timing line did not. Fixing it means either measuring the behaviour directly or widening the budget, and both edit src/tests.rs, which is inside this change's digest and would open a seventh review round on something this change did not cause. Left for whoever has a reason to touch that test.

One more instance of this defect is visible and deliberately left: `.claude/hooks/gate-stop.sh` does the same `cd \"${CLAUDE_PROJECT_DIR:-.}\"` before reading `git diff HEAD`. It appears to work — the Stop gate lists this worktree's files correctly — but only because an exported GIT_DIR happens to point git at the right tree while the `cd` points the process at the wrong one. One broken resolution covered by another. It goes wrong the moment GIT_DIR is not set, and cargo cannot be covered that way at all, which is why gate-commit.sh failed and gate-stop.sh did not. Not fixed here: changes 038 and 040 both record gate-stop.sh as held by change 035, and taking it would make this change the third thing in one diff. — Corrected on 2026-09-19, because that paragraph says the stop gate lists this worktree's files correctly and it does not. GIT_DIR covers only the half of the stop gate that asks git. The other half reads the FILESYSTEM — it walks `docs/sdlc/changes/*/state.yaml` for open contract items, after the `cd`, so no repository pointer can redirect it. Measured: the stop gate named `src/tests.rs` as uncommitted with no gate run behind it while this tree's `src/tests.rs` was staged and three-gates green, and it listed ten open items of which four belong to changes 039 and 049 — neither directory exists in this worktree, both exist in the shared checkout. So the defect is already reported to sessions, in a form that reads as this session's unfinished work and is another session's. Whoever takes it: the subject is the registration and not the script, because `.claude/settings.json` resolves the hook through `${CLAUDE_PROJECT_DIR}` too, so a fix made in a worktree stays dormant exactly as this change's fix to gate-commit.sh did until it was copied across by hand on 2026-09-19.

Landed the repository's half. The tracked .claude/hooks/gate-commit.sh now gates the tree the commit lands in. What it could not reach by itself: the hook that actually runs in a session whose project directory is the main checkout is that checkout's 503-line uncommitted copy, resolved through ${CLAUDE_PROJECT_DIR} by .claude/settings.json — so fixing the tracked file did not unblock the commit that found the defect.

The same two-hunk fix was prepared for that 503-line copy, measured, and then installed BY A PERSON, in one command, which is why this change is committed at all. It was not installed by the session: three separate guards refuse a worktree-isolated session any write to the shared checkout (the Edit tool's worktree-session-owner guard, and the bash guard on both `git -C <shared>` and on a command it cannot prove stays inside the worktree). That refusal is the repository working as designed, and the same sentence AGENTS.md already writes: a tree is changed by a session whose project directory is that tree. The patch and its measurement are kept outside the repository, for rollback and for the next machine:

  ~/.operon-hook-backups/gate-commit.sh.503.20260918-134756   the untouched 503-line copy, for rollback
  ~/.operon-hook-backups/gate-commit.sh.candidate             the same file with the two hunks applied
  ~/.operon-hook-backups/gate-commit-057.patch                the two hunks alone, 4 lines of code
  ~/.operon-hook-backups/verify-candidate.sh                  what was run to believe it

The measurement is change 057's guard re-aimed at the 503-line copy, in temporary repositories with HOME redirected so no global config decides anything: the unfixed hook exits 0 on a landing tree it never looked at, the patched hook exits 2 naming `cargo fmt --check`, and both mutations — CLAUDE_PROJECT_DIR put back in front, and the reported cwd dropped — go back to exiting 0. It also parses under the stock /bin/bash 3.2.57. Installing it matters beyond convenience: the shared checkout's src/tests.rs has no INHERITED_REPOSITORY_POINTERS in it at all, so letting that suite run with a repository pointer exported is the arrangement that committed the staged change as `initial` twice, and change 056's review.yaml now exists, which means the review gate that refused those two writes would no longer refuse them. The two open paused decisions are the same two change 054 left: adopt the 503-line installer, and the one-character fix in gate-stop.sh (change 055). Whoever takes them: the running copy already refuses a redirected commit, so the tracked copy gaining that refusal makes them agree, and the resolution added here is the part the 503-line copy still lacks."

contract:
  three-gates: "machine passed fmt silent, 480 passed 0 failed 6 ignored, clippy silent under both -- -D warnings and --all-targets"
  gate-runs-in-the-landing-tree: "machine passed the_commit_gate_runs_the_gates_in_the_tree_the_commit_lands_in builds two repositories and runs the hook eight ways. Six are the inputs it resolves a tree from: the payload's reported cwd as the only thing naming the landing tree, the repository pointers as the only thing naming it, a reported cwd that no longer exists so the existence check hands the question back to the directory the hook is already in, no resolvable tree at all so CLAUDE_PROJECT_DIR is reached, a CLAUDE_PROJECT_DIR that is not there either so the hook bails out rather than gating whatever it is standing in, and a run where nothing names the landing tree. The last of those is the negative control — a hook that refused every commit fails it, and, measured, fails the bail-out case too; two catchers rather than one, so the control's function holds but its uniqueness would not. The other two runs come before resolution: a commit redirected with `-C`, and a command that is not a commit. An earlier version of this line called the `-C` run a resolution case. Both routes git can take are covered, because the gate has to follow whichever one the commit follows: the pointers override the directory search and .claude/scripts/worktree-init.mjs writes both into every worktree it makes, so that is the route in the arrangement this change is about. It asserts a block and not a pass: the landing tree holds a staged .rs file and no Cargo.toml, so the first gate cannot pass, and exit 2 naming `cargo fmt --check` is the hook having looked there at all. Three details are load-bearing and all three were found by review — the wrong tree holds an untracked buildable crate so its own refusal is a different sentence; the hook's own working directory and CLAUDE_PROJECT_DIR are fields rather than constants, because while they were constants the CLAUDE_PROJECT_DIR case could not reach what it claimed to test; and the fixture asserts its own premise, that cargo fmt passes and cargo test fails in the wrong tree, since no case observes that and a machine without cargo on PATH would make the two trees answer identically"
  guards-verified-by-mutation: "human passed ten watched, each caught by the case it belongs to rather than merely caught — the mutation script compares which arrangement string the failure was reported against, and refuses a substitution that matched nothing. Against the unfixed hook the guard read `left: Some(0) right: Some(2)`: exit 0, meaning the gate passed the commit after looking at a clean tree, which is the finding rather than a side effect. After the fix: CLAUDE_PROJECT_DIR back in front of the resolved tree, the reported cwd no longer read, the redirection refusal made never to match, the pointers dropped before resolving, both fallbacks deleted, only the CLAUDE_PROJECT_DIR fallback deleted, the reported-cwd existence check deleted, the unreachable-directory bail-out replaced with `|| true`, and the trigger both widened to match every command and narrowed to match none.

      Six exist because of a weaker draft, and THREE cases were watched FAILING to catch their own mutation before being fixed: the pointers case, because with neither tree carrying a Cargo.toml exit 2 naming `cargo fmt --check` was true of both; the CLAUDE_PROJECT_DIR case, because the hook's own working directory was a repository so git never reached the fallback the case was named after; and the existence check, which had no case at all and fails in the dangerous direction — a stale reported cwd would send the gates to CLAUDE_PROJECT_DIR, the checkout the commit is not landing in. All three read exactly like cases that decided something, and every one was found by the reviewer rather than by the guard, which is the fact this item exists to record.

      A fourth would have joined them: the case review handed over for the bail-out branch — start the hook outside any repository, point the fallback at a path that is gone, expect exit 0 — passes against the mutation as well as against the fix, because with the bail-out removed the hook stays outside any repository, finds nothing changed and exits 0 either way. Watched, found green, redesigned to start the hook in a tree that does have something to gate. A case handed over by a careful reader is still a case that has to be watched failing"
  reviewed: "human passed `approve 0 3` at digest db44441ac8745b98, recorded in review.yaml, with its three remaining nits accepted rather than fixed and the reviewer's reasons for each written below. Six passes, six digests; the history is in review.yaml because an approval that survived three rounds of request-changes and one that passed on the first read are the same two words otherwise. An earlier pass returned `approve 0 0` on the content against four named questions, and that verdict is now superseded: re-run against the staged diff at digest ea8436748af5c908, the same reviewer returned `request-changes 2 3`. It re-affirmed all four answers and found both Importants outside their scope, which is the argument for asking an open question and not only the questions the author thought of.

      Important 1, taken: the redirection refusal had no guard — deleting the block left the suite at 480 passed, so a `git -C <other checkout> commit` would have been followed. Now a case.

      Important 2, finding taken and proposed fix refused. The finding: git's precedence was stated backwards in the hook, in plan.md and in lessons.md entry 023 — GIT_DIR/GIT_WORK_TREE override the directory search rather than yielding to it, .claude/scripts/worktree-init.mjs:278 writes both into every worktree, and so the fixture that removed them was covering the one route production does not take. Measured: with them set, `git rev-parse --show-toplevel` from /tmp answers the worktree. Entry 022 had already written this correctly one change earlier; restating it from memory inverted it. The refused fix was to drop the pointers before resolving: the commit obeys them, so a session whose pointers name tree A while its working directory is elsewhere would then have the gates run outside A and the commit land inside it — this change's own defect in a new spelling. That refusal is now a watched mutation rather than an opinion. What was wrong was the rationale and the coverage, and both are fixed.

      Three nits: `cd --` taken; the `-C` regex matching anywhere in the command text accepted, with the reviewer agreeing it errs toward refusal; the unpinned `git rev-parse --show-toplevel` step accepted, with the reason written beside the cases in src/tests.rs.

      Round two, digest ba797ed3e9ab99e4: `request-changes 1 2`. The reviewer withdrew its Important 2 remedy and confirmed the refusal above by measuring it, which is the outcome worth recording — the disagreement was settled by a mutation rather than by either side restating itself. Its new Important was right and is the better finding of the three: the fourth case did not exercise the fallback it was named after. With no reported cwd the hook's own working directory was still a repository, so git answered from there, `CLAUDE_PROJECT_DIR` was never consulted, and deleting both fallbacks outright left the suite at 480 passed — while the case's label, the Guard line in lessons.md and this contract all claimed that route was covered. Three documents describing a coverage that did not exist, because the one input they depended on was a constant in the harness rather than a field of the fixture. Fixed by making every such input a named field, adding a case that starts the hook outside any repository, and keeping the old run as an explicit negative control. Both nits taken: the no-refusal assertion no longer requires empty stderr, only the absence of a refusal, so a warning from someone's global git config cannot redden it; and the $TMPDIR dependency of running cargo inside the fixture is written beside the case.

      Round three, digest 0250c87752c24ed9: `request-changes 1 3`. Right again, and the same failure a third time: a sixth input the decision reads with no case varying it — whether the reported cwd exists, read by the hook's `[ -d … ]`. Deleting that check left the suite green, and it fails in the dangerous direction, because a stale reported cwd then sends the gates to CLAUDE_PROJECT_DIR instead of back to the directory the hook is already in. The reviewer wrote the missing case and measured both states before reporting. Fixed with that case, which also corrects the three documents that had again described more coverage than existed — including this contract item and lessons.md's own corollary, which had claimed 'every such input is a named field now' one round after being written. The corollary is now 'enumerate what the decision reads, and vary every one of them', because a field is only the usual way and stating it as the rule is what let this through.

      Its three nits are taken. The fixture now asserts its own discriminating premise — cargo fmt passing and cargo test failing in the wrong tree — which no case observed and which a machine without cargo on PATH would have silently removed. The $TMPDIR note covers `.git` as well as Cargo.toml, and the two matter for different cases: a manifest above would be loud, a repository above would quietly turn the CLAUDE_PROJECT_DIR case into a second copy of the own-working-directory case. And the payload write no longer `unwrap`s between spawn and wait, which would drop a child unwaited and skip the fixture's removal.

      Round four, digest c4afaccd7ac6102f: `approve 0 4`. It answered the three questions it was asked, including the one it had found the previous round's Important with — is there a seventh input — and the answer was not a flat no: two conditions were still constant across every case, both failing in the benign direction, and both pre-existing rather than mechanisms this change adds. That is why it called them nits. Its reasoning against Important is recorded in its report: no wrong result, panic or deadlock on a reachable input, no durability loss, no leaked child, no bypassed gate, no new unsafe, and every mechanism the diff does add is caught by the case that owns it.

      All four nits taken anyway, because two of them were the difference between lessons.md entry 023's own rule and the guard beside it, and shipping a rule a guard does not satisfy is the failure this change had already made three times. Two cases added: CLAUDE_PROJECT_DIR unreachable, and a command that is not a commit. Ten mutations now, all caught by the case that owns them. The fixture's premise assertions run cargo on the same PATH the hook gives it, $HOME/.cargo/bin prepended, rather than on the test process's own. The bands reading is in this file's own bands item rather than left for the next change to discover.

      One correction to the reviewer, recorded because it cuts the other way: the case it designed for the bail-out branch would not have caught the mutation. Measured — details in the guards-verified-by-mutation item.

      Round five, digest 4ac7714fc0c42ab8: `approve 0 3`. It verified the nit-1 correction by reproducing both states, including swapping its own field values into the case and watching the mutation stay green. Its own summary: 'I handed over a case that cannot fail while reviewing a change about cases that cannot fail.' Its three nits were all sentences claiming slightly more than the cases covered — the negative control was no longer the only catcher of a blanket refusal, the bands baseline figure disagreed with the arithmetic in its own next clause, and the $TMPDIR note named one case where the hazard now hits two. All three taken.

      Round six, digest db44441ac8745b98: `approve 0 3`, and recorded in review.yaml. A confirmation rather than an open read, on one claim — that the diff since round five is text-only, which is the reason given for not re-running the ten mutations. It checked that mechanically instead of accepting it: fifteen changed lines in src/tests.rs, every one a `//` comment, and no `arrangement` string literal moved, which is what the mutation script matches on. One mutation re-measured anyway.

      Its three remaining nits are ACCEPTED with its reasons, not fixed, and it said so itself — 'none worth a seventh round'. All three are under-claims or wrong tense rather than over-claims, which is the harmless direction and the opposite of what the first three rounds found. One: the $TMPDIR note calls the repository-above hazard quiet, which holds only if that ancestor has staged Rust changes — a clean one reddens case 4 loudly. Accepted because the substance a reader needs is that two cases depend on the fixture root resolving to nothing, and the hedge errs toward making a machine precondition sound more dangerous than it is. Two: lessons.md says the uniqueness 'would have been false had it been claimed', and it was claimed, by that same line one round earlier — the indicative was due, as the paragraph itself uses two sentences later. Accepted because it is a claim about the line's history and not about coverage, and the correction is present and accurate. Three: 'ten mutations watched' in a paragraph that then cites a measured eleventh, the unconditional `block`. Accepted because it under-counts, and the mutation is described where it matters even though it is not tallied."
  bands: "machine waived `bash scripts/check-bands.sh` prints `bands: 2 of 20 metrics breached`, and the reading is recorded here rather than left for the next change to discover — REVIEW.md:88-89 asks this as its fourth question and the answer is not silent. always_loaded_bytes is 11648 against a 9716 baseline and an 11000 warn tier, verdict `recorded, no action`; it counts CLAUDE.md and AGENTS.md, neither of which this change or 056 touches. steering_bytes is 201096 against a 91262 baseline and a 150000 propose tier, which the script answers with `write an intent.md and re-enter at stage 1`. It counts docs/sdlc/*.md, so this change does move it: lessons.md went 63992 to 72098, about 8100 bytes. But it was already 192990 before this work started — 201096 less the 8106 lessons.md gained, and nothing else this diff touches is in that glob, since docs/sdlc/*.md does not recurse into changes/ — which is roughly 43000 over the tier. An earlier version of this line said 196333, a reading taken partway through this change rather than before it, and disagreed with the 43000 in its own next clause. It is in the audit that opened this whole line of changes as a reported-but-unacted finding.

      So the honest shape of this is a tension rather than a defect: the metric goes further into breach while the change does exactly what CLAUDE.md requires of it, which is to write a lesson with a Guard for a mistake that could recur. Waived because the remedy the tier names is a change about how much instruction this repository loads — it has no change directory and needs one — and because the alternative here would be to not write the entry, or to write it shorter than the failures it records. Whoever opens that change should know the metric grows by construction: every lesson adds to it and lessons are never deleted, so the tier will be crossed again by any repository that keeps learning."
