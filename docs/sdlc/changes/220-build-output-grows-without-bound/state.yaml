# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: feature/220-build-output-grows-without-bound.
#
# Request: the person found the packaged-app folder and the cargo build output
# taking a lot of disk and asked for them to be cleaned on a schedule. Measured: the
# main checkout's build output is 2.9G after the existing trim; the packaged-app
# folder holds only one current and one previous bundle by construction, so the growth
# is the build output of every worktree. Placement: EXTEND scripts/prune-target.sh.
#
# Route: modify.

state:
