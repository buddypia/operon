  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "n/a"

resume: "Write the six failing tests in src/tests.rs, watch them fail, then edit scripts/prune-target.sh, add scripts/install-prune-schedule.sh and the Makefile targets."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  release-binary: "machine pending no: touches scripts/, Makefile, src/tests.rs and docs only; /Applications/Operon.app is not made stale"
  guards-verified-by-mutation: "human pending each new guard watched failing"

sets:
