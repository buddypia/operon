# Change 316. The person, on the map after 315 landed (2026-11-24): 「これだけでは
# 物足りないよ。画面の流れは本物に近いUI/UXにしたいとわかんないよ。他も色々機能
# 不足で使い勝手やそもそも情報量が少ない」.
#
# Decisions taken by the managing session (recoverable by a revert, so not put
# to the person): the screen flow shows real pictures of the application taken
# apart from the person's data (change 314's isolation), not drawn wireframes as
# learn_korean does, because a picture cannot drift from the application the way
# a drawing does; pictures are committed at window size so the map works from a
# fresh checkout. Found while photographing and left out (not asked for): icon-
# only buttons have no accessible name; reported to the person as a candidate.

