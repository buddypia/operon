#
# The Important, from subprocess-067, verified against the file before it was
# acted on: the new `bash scripts/check-installed-build.sh` call sat BEFORE the
# position stamp was written. `/Applications/Operon.app` is the first thing this
# hook reads from outside the repository and can sit on a mount that does not
# answer — and asked before the stamp, a hang meant the position was never
# recorded, so the next stop re-entered the identical hang. The hook's own
# header promises it refuses once per tree state and never twice; that promise
# did not hold on the path this change added.
#
# Taken rather than carried, which is what REVIEW.md reserves for an Important,
# and in both halves:
#   - the block now runs after `printf '%s\n' "$state" >> "$stamp"`, so a hang
#     costs one stop instead of every stop at that position;
#   - the call is bounded by `perl -e 'alarm shift; exec @ARGV'` at
#     ${OPERON_INSTALLED_CHECK_SECONDS:-5} seconds. perl's alarm is preserved
#     across exec, which is the portable timeout on a machine with no
#     timeout(1). Verified empirically before it was written in: a fixture that
#     does `exec sleep 30` returns status 142 in one second with empty output,
#     while an ordinary run returns status 1 in zero seconds with its output
#     intact. Only exit 1 produces a report now; 0, 142 (deadline) and 127 (no
#     perl) are silence.
# Neither half saves a process in uninterruptible D-state, and the reviewer said
# so. The stamp ordering is what keeps that worst case from repeating.
#
# The guard grew three assertions, not one —
# `the_stop_gate_reports_an_installed_build_that_is_behind`: the hanging fixture
# must not cost 20 seconds; its already-emitted stdout must not be printed,
# which is what says the hook judges by exit status rather than by whether bytes
# came back; and the same position run again, without clearing the stamp, must
# return empty and faster than the first. That last one is the assertion for the
# ordering. The fixture uses `exec sleep 30` rather than `sleep 30` on purpose:
# a `sleep` child would hold the pipe open and the command substitution would
# wait for it however the parent died, so the bound would have read as verified
# while being untested.
#
# Two mutations were added for the fix and watched failing —
# `check-runs-before-the-stamp` and `bound-removed`. The sweep is 16 of 16.
#
