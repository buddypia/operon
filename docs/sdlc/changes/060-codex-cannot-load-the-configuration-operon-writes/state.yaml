    found the part nobody reported — a dotted key reaching past the leaf
    creates it and a table header reaching past it does not, so the rule is not
    symmetric and treating it as symmetric refuses `[hooks.state.\"K\".sub]`
    for nothing. A key the writer cannot round-trip is refused rather than
    escaped, because escaping would be the only encoder in a file with five
    decoders; 062 holds it. Round 11's rust nit closed by deletion in the same edit: `extendable`
    restated a fact by comparing two lists, and a restatement has no place to
    put the question it stands in for. Lesson 034"
  a-well-formed-wrong-answer-is-still-wrong: "machine passed the fixtures assert
    the person's key survives BY NAME — parsed[profiles][gpt-5.6][hooks] and the
    [hooks.state.\"…\"] shape Operon writes itself — and not only that the
    document parses. Round 5's defect deleted a line and left valid TOML behind,
    so every parse-based guard this change had built was blind to it. A
    well-formedness guard cannot see a well-formed wrong answer"
  a-header-name-must-look-like-one: "machine passed table_header_name requires a
    TOML key path, so `  [1, 2]` is not a table called `1, 2`. This is the one
    place the change gets STRICTER rather than more generous, and it has to:
    the write-nothing rule protects against recognition FAILING, and here
    recognition succeeded at the wrong answer"
  guards-verified-by-mutation: "human passed 80 of 80 in mutations.py beside this
    file, each watched failing, including the defect itself put back. Mutations
    reach BOTH implementations: the Rust line editor and the script's awk, added
    in round 3 because the half that had been wrong twice had no mutation on it
    at all. TWICE now a mutation was removed rather than weakened — key_of's
    `starts_with('#')` branch, which cannot change an outcome because a
    commented line yields the key `# hooks`, and in round 4 the narrow strict
    scan in set_features_hooks, which the generous reader beside it fully
    subsumes. Both branches went with their mutations: a guard whose mutation
    cannot fail is not a guard. Round 7 is the third and fourth time, and it
    arrived the other way round — the mutations were not removed, the FIX
    silently made six of them unable to fail, and only re-running the set said
    so. That is its own contract item above. Round 8 removed a THIRD branch for
    the same reason, this one named by review: might_assign's `starts_with('#')`
    and `starts_with('[')` tests cannot change an answer, because the identity
    test already refuses `# hooks` and `[features] # hooks`. The comment there
    says so, because the branch reads like a guard. Round 9 is the FIFTH, and it
    arrived from a fix again rather than from reading: unquoting the removal's
    key put a second .trim() over one assignment_of already does, and the
    mutation that takes the first one out came back green. The redundancy came
    out of the CALL SITE rather than out of assignment_of, because the remaining
    difference is real — `\" hooks \"` is a key TOML names ` hooks `, a veto may
    be generous about it and a branch that deletes may not. Round 12 said the
    LOUD thing again and only the loud thing: 58 of 63 on the first run, five
    [SCRIPT BUG] lines and zero [NOT CAUGHT], because collapsing `removable`
    back into the removal filter and giving `table_header_shape` a second return
    value moved four mutations out from under their find-strings. Re-pointed
    before the run rather than by it for the second round running, and the four
    new ones landed red first time. Round 13 is the first round of this change
    with a CLEAN first run — 64 of 64, no [SCRIPT BUG] and no [NOT CAUGHT] —
    because the rename it made was carried into the mutation set in the same
    edit instead of after a run reported it. Round 14 went back to 68 of 70 on
    the first run with two [SCRIPT BUG] and no [NOT CAUGHT] — the drop loop and
    the array branch both moved — which is the honest reading: carrying a
    rename is easy to do deliberately, and noticing that a rewritten loop moved
    two find-strings is not"
  unrecognised-input-is-survivable: "machine passed
    codex_hook_install_writes_a_config_codex_can_load carries the spellings this
    line editor does NOT recognise and asserts only that the result still
    parses, never that the flag got set. That is the point: review spent three
    rounds on one reported spelling at a time, and the fourth named the
    direction instead. Writing nothing costs a flag that is not set; writing
    anyway costs a machine on which Codex loads no configuration at all. The
    membership of that set MOVED in round 7 and the item did not: a [features]
    whose body opens with a multi-line array is now recognised, because the
    state machine reads past the array; a quoted table name is still not, and a
    file whose only [features] is inside a multi-line string joined the set by
    the veto's decision rather than by the reader's. The fixtures name which is
    which"
