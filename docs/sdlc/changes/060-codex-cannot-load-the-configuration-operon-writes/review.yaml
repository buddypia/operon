# ROUND 6, digest bad8f02b6a116254 — `approve-with-nits 0 2`, the verdict
# recorded below. Six rounds, twelve Importants, and the shape of the whole
# review is worth one paragraph: every single finding was reached by RUNNING
# apply_codex_config over an input nobody had thought to type, and not one came
# from reading the diff. Three separate times the fix for a finding introduced
# the next one, and twice a sentence this session wrote claiming coverage —
# "the two readers cannot drift again", "5 of 5 watched failing" — was false at
# the moment it was written.
#
# Nit 1 is OPEN and deliberately not fixed here. `table_header_shape` finds the
# closing bracket with a plain `split_once(']')`, which does not respect quotes,
# so a header like `[projects."/Users/me/dir[1]"]` is invisible to the generous
# reader as well as the strict one — and the generous reader is the safety net
# against deletion, so this is a known hole IN the net. Measured by the
# reviewer: `first_table` runs to end-of-file and the person's `hooks = true` is
# removed, with the output still valid TOML. Same failure shape as round 5's
# Important, through a different door.
#
# It is not fixed here because fixing it would change the digest and discard the
# approval at this one, and the reviewer said plainly they were not asking for a
# seventh round. It is not dropped either: change 062 carries it, and the fix is
# the one the reviewer described — reuse `is_key_path`'s quote-aware walk to
# find the bracket, which closes `end` at the same time.
#
# Nit 2 (`2>/dev/null`) closed as accepted rather than fixed.

# ROUND 7, digest 8dbd59c5d48b590d — the FIRST rust-review, three Importants,
# `do-not-approve`. They are one defect and the reviewer said so: `lines[…]` was
# read one line at a time, when whether a line means anything depends on the
# lines before it. Each reached the user a different way.
#
#   1. `set_features_hooks`'s end-of-table scan stopped at `  [1]` inside
#      `matrix = [ … ]`, hid the `hooks` already under `[features]`, and
#      inserted a second one — `duplicate key hooks in table features`, which is
#      this change's own failure through a door it had not checked. `  [1]` is a
#      legal table name read alone, so round 5's "the name must look like a key
#      path" could not see it, and neither could `[1.2]`, `["a"]` or `[true]`.
#   2. `[[features]]` was not a header to `table_header_shape` at all:
#      `split_once(']')` leaves `]` behind, the line stops being a header, and
#      both directions of that are damage — the top-level region runs past it
#      and deletes the `hooks` inside, and the duplicate veto cannot see it
#      either, so `[features]` is appended beside `[[features]]`.
#   3. `apply_codex_config` ran `assignment_of` over every line before the first
#      table without asking whether it was inside a multi-line string, so a
#      `hooks = true` written in somebody's `note = """ … """` was removed and
#      the note quietly lost a line. Valid TOML before and after, so every parse
#      guard this change had built was blind to it.
#
# All three are closed by one state machine, `structural_lines`, and the review
# said in as many words that #1 and #3 close together. What it did not say, and
# what the mutation run found, is in lesson 032: the fix turned SIX red
# mutations green. Every fixture that told the strict reader from the generous
# one did it with a bracket-shaped row inside an array, and those rows are no
# longer read as headers by either reader. Two were genuinely subsumed; four had
# simply moved out of the space a parse-based fixture can reach, and
# `a_config_toml_would_refuse_is_still_not_a_config_to_delete_from` is the test
# written to reach them — it reads lines, because neither its input nor its
# output parses.
#
# Two decisions in this round are the reviewer's to push back on:
#
#   a. The two VETOES deliberately do NOT consult the state machine, so a
#      `[features]` or a `hooks = true` that is really prose still stops the
