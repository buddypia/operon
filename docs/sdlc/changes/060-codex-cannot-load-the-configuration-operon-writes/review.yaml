# showed nothing of that class. `structural_lines` was the right answer to the
# diagnosis. What it does not yet do is nest.
#
#   1. `continues_value`'s Array arm (src/tmux/hooks.rs:821) never looks for a
#      fence, so a `"""` or `'''` opened INSIDE a multi-line array is invisible
#      and `bracket_depth` counts the brackets in its body as structure. Three
#      damage shapes, every one of them valid TOML in and valid TOML out, so the
#      round-6 parse guard cannot see any of them:
#        - `model = [ """\na]\n""", """\n[features]\n""", ]` — the `]` in the
#          first string closes the array early, the second string's body is read
#          as structure, and `hooks = true` is written INTO the person's string.
#        - the same file with `hooks = true` as the string body: the line is
#          read as a top-level scalar and deleted, emptying the note. This is
#          round 6's finding 3, one nesting level down.
#        - `note = ["""\n[\n"""]` then `[features]` with `matrix = """\n]]\n"""`
