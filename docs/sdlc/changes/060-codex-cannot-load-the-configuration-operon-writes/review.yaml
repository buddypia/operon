# its OWN OUTPUT. All forty `apply_codex_config(` call sites in the suite hand
# it a config somebody typed, and this defect needs two calls in sequence —
# which is what Operon does, since it installs its hooks on every launch.
# Lesson 033 was two branches never run in one call; this is one call never run
# twice. Five keys (`]`, a lone `[`, `[[a]]`, a path with a space, an ordinary
