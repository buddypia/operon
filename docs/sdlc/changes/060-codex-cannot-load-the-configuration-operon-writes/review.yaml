#
# THE IMPORTANT, and it is this round's own regression. Round 14 replaced the
# drop loop's raw-text header comparison with one by key path. That was right
# and it closed the class it was aimed at — but it LOST a case the raw text
# had handled. `table_header_shape` finds its closing bracket without
# respecting quotes, so `[hooks.state."/Users/me/Accounts/[work]/hooks.json:
# stop:1:0"]` splits at the `]` inside the key and is a header to nobody. The
# old comparison did not care; it matched the line as text. The new one asks a
# reader that answers `None`, the line falls to `assignment_of`, which returns
# `None` for anything opening with `[`, and Operon's own block became
# invisible to every reader in the function.
#
# Reproduced before it was touched: `tomllib` reads that header as the key
# `/Users/me/Accounts/[work]/hooks.json:stop:1:0`, and `table_header_shape`
# splits at index 38 of 61, leaving a name of `hooks.state."/Users/me/
# Accounts/[work` and a `rest` that is neither empty nor a comment.
#
# The cost is real and reachable. `choose_agent_account_folder`
# (src/app.rs:5518) is an `rfd` folder picker, `]` is legal in a macOS folder
# name, and the trust key is that path. The FIRST launch writes a correct
# block; every launch after it appends a duplicate, Codex loads no
# configuration under that root from the first frame, and the backup taken
# before each write replaces the good copy with a broken one.
#
# Closed in the shape the reviewer proposed, which is the rule this function
# already states one branch up: `can_hold_hook_state` refuses when a
# structural line opens a table it cannot READ as one. The comment at the
# `key_segments` branch had already written the argument — "a header misread
# means the rest of this walk attributes keys to a table it invented" — and
# applied it only to an unterminated quote. Refusing closes the class rather
# than the character; 062 makes the bracket search quote-aware and turns the
# refusal back into a replacement.
#
# The reviewer's point about the deferral is the part worth keeping: the
# quote-unaware bracket search was a KNOWN nit, carried to 062 on the argument
# that a generous reader could not see it. Generalising the caller changed
# what that nit costs, and nobody re-read the deferral. A nit is deferred
# against the code as it was.
#
