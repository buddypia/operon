# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/212-every-japanese-string-is-translated.
#
# Report: found while closing change 202's rows. The session view drew
# 「✓ 完了」 and 「● 実行中」 as literals, so an English or Korean screen showed
# them in Japanese; a checkpoint diff cut at 1 MB ended in a Japanese note;
# a manual checkpoint was named 「手動作成」 whatever the language. The table
# tests read only what passes through tr and tf!, so none of them saw these.
#
# Fix: the four go through tr, with rows in both tables. A test reads every
# string literal in src/ outside the tests and the tables, and refuses Japanese
# that has no row, that has a row but is written where nothing translates it,
# or that is named as data no more. Data that is never shown — session names
# saved by older versions, the knowledge embedding exemplars, words the
# ranking looks for — is named in the test with its reason. Lesson 097.
#
# Decided: a manual checkpoint is named in the language active when it is
# made; it is stored in the checkpoint's commit, like the turn summaries
# beside it, and is not translated again later.
#
# Decided: the test does not join the commit gate's record tests. It reads
# files only, which lesson 096 says belongs before the commit, but the gate
# is a paused surface and CI runs it before any merge. A literal it refuses
# costs one CI run, not a landing.
#
# Route: bugfix.

