# Review record for 160-launch-fails-when-a-second-pty-is-unavailable.
#
# The change: `start_tmux_agent_session` ends its `/bin/cat` placeholder with
# an EOF and waits for the pane to be dead before `respawn-pane`, so a launch
# no longer needs a second pty while the old one is still held.
#
# Verified by rust-reviewer against .claude/rules/rust.md: both callers run in
# spawn_background, the resume path is outside the frame loop; no new
# unwrap/expect/panic, no SQL; both tmux calls go through tmux_command() with a
# timeout; the test's .output() calls are in src/tests.rs, outside
# unwrapped_spawns.
#
# Verified by subprocess-safety-reviewer: the EOF reaches the session's only
# pane, and stays queued on the tty if cat has not started yet; every tmux call
# is bounded at 5 s; on `?` the outer and_then chain still kills the new
# session; a wait that never sees Dead falls back to -k as before; the brief
# Dead state is not misread as Exited, because request_session_poll skips
# Starting sessions (src/app.rs:2953-2958); the test hook only appends, and
# matches its own session name exactly.

