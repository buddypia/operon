# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: an Antigravity conversation restored into Codex CLI wrote its Codex
# rollout (01a14579-efb3-7ac3-b27d-ce87b533e839, 1.2 MB) and then failed to
# open: "respawn pane failed: fork failed: Device not configured". (The same
# report's Claude Code half is change 159.)
#
# Cause (root-cause skill): `start_tmux_agent_session` (src/tmux.rs) holds the
# window open with a `/bin/cat` placeholder and then runs `respawn-pane -k`
# over it while it is still alive. tmux's spawn.c, read at master: with
# SPAWN_KILL it closes the pane's master fd and calls `fdforkpty` at once — it
# sends no signal and waits for nothing — while `cat` still holds the slave. So
# for that moment the launch needs a second pty, and forkpty's ENXIO is macOS
# refusing a new pty. Measured during the failure window on tmux 3.8, private
# servers: today's sequence failed 10/10; the same sequence with the
# placeholder exited first succeeded 10/10, as did respawn retried after a
# pause (the first attempt has by then freed the old pty). Some minutes later
# every variant passed again: the shortage was transient, and what held the
# ptys then is no longer observable (139 ttys open afterwards, limit 511).
#
# Fix: end `cat` with an EOF on its tty and wait (≤1 s) for the pane to be
# dead before the respawn, so a launch never needs two ptys. `-k` stays as the
# fallback if `cat` outlives the wait.

