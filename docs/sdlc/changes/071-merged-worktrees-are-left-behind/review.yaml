# Round 1: subprocess-safety-reviewer returned do-not-approve 1 6. The
# Important finding was that a mistyped path was reported as cleaned. It is
# fixed, together with N2, N3, the doc drift, and rust-reviewer nits 1, 3, 4
# and 5. The plan's "Departures from the plan" section lists each one. Round 2
# approved with nits. The nits below are carried rather than taken, per the
# review-round ceiling.

nits: []

carried:
  - "ops.mjs cleanup-worktree — `git worktree remove --force` deletes gitignored files, and the safety check never sees them. In this repository they are scratch space, generated per-worktree config, and target/, but list the ignored files that cannot be rebuilt in warnings before removing (subprocess N1)."
  - "worktree-shipping-guard isLandedOnBase — a worktree stacked on a feature tip that was later merged, or a branch that keeps being worked after its merge, is told to clean up. cleanup-worktree still refuses any real work, and the 5-minute marker limits this to one block (subprocess N4). It also stops at origin/main without checking local main when a remote exists."
  - "isLandedOnBase runs an unbounded `rev-list --merges --parents main` per clean worktree; `--ancestry-path <tip>..main` bounds it (subprocess N5)."
  - "Untested accept path: no remote, ahead of main, with a tree identical to main (subprocess N6). The symlinked main-checkout spelling is not tested either (R2-3)."
  - "ops.mjs linked-worktree gate — a directory under .worktrees/ that git no longer lists is refused, not reaped, and nothing sanctioned can remove it. Hand such a path to reapWorktreeResidue alone (subprocess R2-1)."
  - "ops.mjs — a listed worktree whose directory is gone keeps its branch: the branch is read with rev-parse inside the missing directory. Take it from `worktree list --porcelain` instead (subprocess R2-2)."
  - "src/tests.rs — the mistyped-path case accepts any failure; also require `not a linked worktree` in the output (rust R2 nit 1). node runs through a raw .output() with no timeout (rust nit 2, carried from round 1)."
