# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Bug report (it is the intent on this route): the final adversarial review of
# change 182 the person asked for (2026-10-21: "批判的思考と敵対的レビューに基づいて
# 最終検証を行うこと。発見された問題点・改善点は根本的かつ長期運用が可能で…") probed
# the landed publishing gate and found three things:
#
# 1. A command that only names a push as text — `git commit -m "… git push …"`,
#    `grep -rn "git push" docs/` — is put to a person. Same class as 182's
#    report: a prompt with nothing to decide.
# 2. `git -C dir push --force origin main`, `git -c k=v push …`,
#    `git --no-pager push -f …` and `git<TAB>push --force …` run unasked. The
#    gate's detection is `\bgit +push\b`, which none of them match, and main has
#    no branch protection on GitHub, so nothing else stops a force push of main.
# 3. A heredoc holding `git push` as text is denied with "run the push alone",
#    which is not what it needs.
#
# Named cause: the gate decides on a pattern that is both too narrow (literal
# `git` space `push`) and judged per segment, so its ask can carry commands it
# never read and its detection misses the forms git accepts. The fix is one
# decision on the whole command: allow only the plain push, ask only about a
# lone push a person can read whole, deny everything else that names a push.
#
# Risk: `.claude/hooks` is gate-configuration (high, paused). Every move is
# toward refusal — ask→deny where nothing runs either way, unasked→deny/ask for
# the missed forms — and nothing new is allowed; a paused surface still goes to
# a person, and the person's request above is that decision.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "paused"
  risk: "high"
  readiness: "pending"
  screen: "n/a"

resume: "Done. Carried: a push word split by an expansion with no literal push
  on the line still runs unasked, as on main — GitHub branch protection on main is
  what closes every spelling, and is the person's to turn on."

contract:
  failing-test-first: "machine passed a_plain_push_to_origin_is_not_asked_about
    failed on the unedited hook at its first new deny (the reason did not say
    how to keep text out), and passes on the edited one"
  three-gates: "machine passed cargo fmt --check silent and cargo clippy --locked
    -D warnings clean, re-run by gate-commit.sh on the commit; the named test
    passes; the whole suite runs in CI on the push"
  release-binary: "machine passed no: .claude/hooks, src/tests.rs and docs only —
    /Applications/Operon.app is not made stale"
  guards-verified-by-mutation: "human passed mutations.py in this directory: 15
    of 15 caught, the claim among them"
  review: "human passed rust-reviewer approve-with-nits 0 2 and
    subprocess-safety-reviewer approve-with-nits 0 2 at fd5921242a548115, round 4;
    nits carried with person lines in review.yaml"
  lesson-recorded: "machine passed entry 085 in docs/sdlc/lessons.md with its Guard"

sets:
