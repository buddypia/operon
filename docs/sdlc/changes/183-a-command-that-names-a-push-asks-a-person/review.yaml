# Four rounds, both reviewers each time. The route's ceiling is 2; rounds 3 and
# 4 were each bought by an Important that let a force push run unasked, and
# REVIEW.md lets only an Important move the digest.
#
# Round 1: both reviewers, Important — spellings the shell runs as a push went
# undetected (`"git" push`, `git pu""sh`, backslash-newline, `git -C a\ b push`,
# a computed program or alias). Fixed: a second reading as the shell hands git
# its words; a computed program counts when `push` appears.
#
# Round 2: subprocess-safety-reviewer, Important — computed subcommands in
# argument position (`git $(echo push)`, `${IFS}push`, `P=push; git $P`,
# `Alias.`). Fixed: an expansion as git's subcommand counts as a push.
#
# Round 3 (digest 5cb1fd656f9842d5): rust-reviewer approve-with-nits 0 2;
# subprocess-safety-reviewer do-not-approve 1 2 — an option argument with an
# embedded quote or expansion (`git -c user.name="a b" push -f`) was not read,
# so the force ran unasked. Fixed by no longer reading option arguments: once an
# option follows git, any later word `push` counts. A replay of the 7,728
# distinct Bash commands in this project's transcripts then showed round 2's
# rule refusing 185 ordinary `git -C $W …` lines, so an expansion after an
# option counts only when the word push is on the line. Against main, 34 past
# commands move from allow to deny and 59 from ask to deny.
#
# Round 4 (af762fe44c712ac5): both approve-with-nits, 0 Important. The safety
# reviewer replayed its round 1–3 cases and about 40 new ones: nothing runs
# unasked that did not on main, and nothing main asked about or denied is now
