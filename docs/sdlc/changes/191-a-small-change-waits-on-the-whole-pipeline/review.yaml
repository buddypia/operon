# Review record for 191-a-small-change-waits-on-the-whole-pipeline.
#
# The change: a new worktree's target/ is cloned from main's (APFS, copy on
# write) so its first build checks only `operon`; the format-on-edit hook
# formats the edited file in its own tree instead of main; a session gives
# back its worktree leases when it ends; the owner guard imports realpathSync;
# ci.yml runs three macOS jobs instead of five and harness.yml only the evals.
#
# Round 1: subprocess-safety-reviewer found that `make wt.new` run from inside
# a worktree made the seed step exit 2 after the worktree existed and seed from
# that worktree's target/ (Important; rust-reviewer named the same as a nit).
# Round 2 resolves both ends from git's common dir and exits 0 when anything is
# missing; the test runs the script on a fixture from inside another worktree,
# watched failing with the main root taken from the current checkout.
#
# Verified by subprocess-safety-reviewer: no check was dropped from CI — the
# hook checks, metrics and bands moved into `checks`, `cargo test --locked`
# still runs in `test`, and the removed job could not fail. SessionEnd releases
# only leases whose owner is this session.

