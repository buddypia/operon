# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: modify (terminal path links exist; ⌘-click moves from external open to
# Operon, right-click gains a pointer-anchored menu, bare names resolve).
# Risk: low — drawing (`src/app.rs`, `src/app/screens.rs`), `src/files.rs`,
# strings, tests, manuals; screen required, and the person's request quoted in
# intent.md is the structural decision.

state:
  route: "modify"
  stage: "build"
  status: "in-progress"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Build R1-R6 test-first per plan.md, then make q.fast and cargo test --locked terminal_293_."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  release-binary: "machine pending required - src/app.rs, src/app/screens.rs, src/files.rs, and src/i18n_tables.rs change; package from main after landing"
  guards-verified-by-mutation: "machine pending python3 docs/sdlc/changes/293-terminal-paths-open-in-the-wrong-place/mutations.py"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
