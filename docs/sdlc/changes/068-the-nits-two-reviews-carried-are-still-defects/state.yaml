# THE ROUTE IS `bugfix` AND THE BUG REPORTS ARE THE REVIEWERS'.
#
# docs/sdlc/routes.yaml gives bugfix `build,test` and says why it skips intent
# and spec: "the bug report is the intent, and inventing a spec for it is the
# ceremony that gets pipelines abandoned." Here the bug reports are literally
# written down already — four entries under `carried:` in two committed
# review.yaml files, each naming a file, a line, and what is wrong with it:
#
#   061 rust/1         src/history.rs settle_deferred_kinds, the Operational arm
#   067 subprocess/1   scripts/check-installed-build.sh, `cd` without `--`
#   067 subprocess/2   scripts/check-installed-build.sh, `$1` with a leading `-`
#   067 subprocess/3   mutations.py, subprocess.run with no timeout=
#   067 durability/1   scripts/check-installed-build.sh, a damaged Info.plist
#
# subprocess/1 and subprocess/2 are one requirement here, not two: both are the
# same mistake — a path that begins with a hyphen read as an option — and a fix
# for either alone leaves the script inconsistent with itself in the way the
# reviewer objected to.
#
# `.claude/skills/root-cause/SKILL.md` is what the route requires, and its Iron
# Law is honoured per requirement rather than for the change as a whole: each
# cause below was reproduced at a terminal before anything was edited, and
# plan.md records the observation that proves it.

# WHAT IS NOT IN SCOPE, because a carried nit is allowed to stay carried.
#
# 061 rust/2 — the notice's two new message ids have no row in
# src/i18n_tables.rs — is NOT taken here, and this is the same decision 061 made
# for the same reason. There are 91 untranslated ids in that file; two of them
# are 061's and 89 predate it. Taking the two would leave 89, which is the
# backlog and not this change, and taking all 91 is a change of its own with its
# own review. The nit exists to tell whoever does that change the count moved
# from 89 to 91, and it keeps doing that from 061's review.yaml.

# READINESS IS `pending` AND STAYS `pending`, which is a statement about the
# gate, not about this change. `bash scripts/check-readiness.sh
# docs/sdlc/changes/068-the-nits-two-reviews-carried-are-still-defects` returns:
#
#   blocking  …: intent.md がありません
#   readiness: No-Go — 1 blocking, 0 warning
#
# The `bugfix` route skips stage 1 by design, and the script never reads
# routes.yaml — its first phase returns on a missing intent.md before anything
# else is judged — so no route that skips stage 1 can reach Go. Every bugfix on
# this branch records `pending` for this reason (055, 059, 060, 061, 064, 065,
# 066), which makes it a pattern and not an exception. Change 067's state.yaml
# calls it the fifth failure of that change's own shape and deliberately left it
# alone; it is still nobody's, and it is still not this change's, because this
# change's own route runs through it.

# RISK IS `low` AND AUTONOMY `full`, and the reason is worth one line because it
# is unusual for a change that edits a gate's helper.
#
# docs/sdlc/risk.yaml classifies by path, and none of this change's paths match
# a surface: `scripts/check-installed-build.sh` is on no surface at all,
# `src/tests.rs` is on none, and `docs/sdlc/changes/*/mutations.py` is on none.
# `bundle-swap` names scripts/package-macos.sh and
# scripts/replace-macos-bundle.sh and stops there; `harness` names
# harness-metrics.sh, check-bands.sh and bands.yaml and stops there.
#
# That gap is real and it is NOT fixed here. check-installed-build.sh arrived in
# change 067 and reads a bundle outside the repository on the Stop gate's path,
# which is `harness`'s description — "the pipeline's own instruments. Silent when
# wrong" — almost word for word. Adding the row is a policy edit that changes
# what every later change must do on that path, so it gets its own decision
# rather than riding in on a nit-clearing bugfix. Recorded in resume.
#
# scripts/check-review.sh still requires a reviewer here, from the other half of
# its rule: this diff adds a `Command::new` line, which pulls
# subprocess-safety-reviewer in whatever file it lands in. That is the right
# reviewer for shell argument handling, and it is the one this change asks.

