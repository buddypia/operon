# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: feature/274-ui-wording-reads-machine-made.
#
# The UI text reads as machine-made in ja/en/ko; 188 messages are reworded and the
# idle status word 「手すき」 becomes 「アイドル」.
#
# Route: modify (placement EXTEND in src/i18n_tables.rs, src/ui/widgets.rs, the
# message ids at their call sites, the READMEs and the manuals).
#
# Risk high, autonomy paused: src/store.rs is a paused surface. Its edit is two
# notice literals, no persisted shape, write order, migration or cancellation,
# so approval.md gives the store category to the evaluator.

state:
  route: "modify"
  stage: "build"
  status: "in-progress"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "paused"
  risk: "high"
  readiness: "go"
  screen: "approved"

resume: "Write R2/R3 tests and move R1/R5 tests, watch them fail, then apply wording.md with the script."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  release-binary: "machine pending yes: touches src/i18n_tables.rs and src/ui/widgets.rs, so /Applications/Operon.app goes stale and the change ends with bash scripts/package-macos.sh"
  guards-verified-by-mutation: "machine pending each new guard watched failing in mutations.py"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
