# Change 297. Bug report, as the bugfix route takes it in place of an intent:
#
# `.claude/hooks/gate-stop.sh` walks every docs/sdlc/changes/*/state.yaml at
# each stop and drops the ones not in play one at a time, three child
# processes each. With 290 changes it takes 6 to 13 seconds on an idle
# machine. Over the 30 days to 2026-11-16, 182 stops in this repository's
# transcripts ran into the hook's 30-second timeout and were recorded as
# `hook_cancelled`: each cost the person half a minute and checked nothing —
# no open contract, no approval ledger, no branch audit — while the turn ended
# as if the gate had passed. The cost grows with every change that lands.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "paused"
  risk: "high"
  readiness: "conditional"
  screen: "n/a"

resume: "Done. After landing, the transcripts' Stop records should show gate-stop.sh finishing in about a second, with no hook_cancelled."

contract:
  three-gates: "machine passed fmt and clippy at commit; cargo test --locked the_stop_gate_ approval 17 passed, lesson harness every_state_file sdlc change_ 37 passed; full suite in CI"
  bands: "machine passed bash scripts/check-bands.sh: warn and diagnose rows only, none moved by this diff"
  failing-test-first: "machine passed the_stop_gate_does_not_pay_for_changes_it_is_not_working_on failed on the unedited gate-stop.sh: 25 child processes with 2 parked changes, 199 with 60; the_approval_ledger_reads_every_ledger_in_one_pass failed on the unedited check-approvals.sh: 15 with 2 ledgers, 189 with 60"
  release-binary: "machine waived touches .claude/hooks, scripts/check-approvals.sh, docs/sdlc and src/tests.rs only; none is in the bundle"
  guards-verified-by-mutation: "machine passed 6 of 6 caught: python3 docs/sdlc/changes/297-the-stop-gate-runs-out-of-time-and-checks-nothing/mutations.py"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
