  - "2026-10-30 · scripts/seed-target.sh に --reset-only <root> モードを追加し、target/debug だけでなく target/*/build/*/out/build/CMakeCache.txt を退避対象にする — ローカル worktree の clone キャッシュ（change 230）と CI の復元キャッシュ（debug / release 両プロファイル）で同一の CMake キャッシュ退避ロジックを共有するため"

