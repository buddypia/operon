# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Bug report (it is the intent on this route):
# 1. Since 095, .claude/state/governance-events.jsonl records the trunk
#    allowlist refusing reads that change nothing: `ps` (4), `git push origin
#    main 2>&1` and `gh run … 2>&1` (refused only for the stderr redirect),
#    `git fetch -q origin` / `--prune origin`, `sed -n '/re/,$p'`, `codesign
#    --verify`, `uptime`, `sysctl -n hw.ncpu`, `tmux ls`. Each cost a session a
#    retry or a detour through a worktree. The person approved letting them in
#    on 2026-10-07 (「対応して」, answering change 130's proposal).
# 2. Cause: the list and one spot in the guard. The patterns judged the text
#    with fd-only redirects still in it, so a pattern anchored at its end
#    missed `2>&1`; and the list never named the process/machine reads, a
#    remote-tracking fetch, or sed's regex addresses. Watched failing: the
#    extended test refused `ps -o … -p 473` on the unedited policy.
# 3. Kept out on purpose: awk (an interpreter); `git -C` aimed at another
#    repository and `$VAR` paths (095's logged edge cases, unchanged); a fetch
#    with a refspec or another remote (`origin main:main` moves local main);
#    sysctl with `=` or `-w`; tmux beyond its list commands; codesign beyond
#    --verify; sed beyond a print with line or regex addresses, and a regex
#    address holding `\` or `[` (review: `/a\/p;/w out/p` wrote `out/p`).
# 4. Review round 1 found three more ways past, each fixed with a denied case:
#    the redirect filter dropped quoted words (`uniq a '>&1'` wrote `>&1`), so
#    drops nothing from a segment holding a quote or a backslash (round 2:
#    counting bare tokens was fooled by `' >&1 '` and an env prefix); `>&1x` read
#    as an fd dup though bash writes `1x` (bash-segments.mjs now needs the fd
#    to end the word); git's own options in front of fetch (`-c
#    core.sshCommand=`, `-C`, `--git-dir`) are refused. The same `-c` route in
#    front of the already listed `git push`/`git log` is recorded in the guard
#    header, not changed here.
#    `ps` with `e`, `-e` or `-E` prints every process's environment, secrets
#    included, so those spellings stay out (review nit, taken). Its lookahead
#    also refuses bare format names holding an e (`ps -o etime`): false-closed,
#    kept; `-o pid,etime` passes.

