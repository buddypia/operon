# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report (the person, 2026-10-21): fix every item left over from 191 and 192
# for good. This one: the trunk guard refuses commands in a worktree that
# cannot reach the trunk.
#
# Found: .cli/lib/bash-segments.mjs splits a command into words and removes
# the quotes, and pathArgs then took every `$` and every leading `~` for an
# expansion. A word whose reach is unknown makes isWorktreeSegment say no, so
# `awk '{print $NF}' f`, `grep -n 'a$' f` and `sed -n 's/^x$/y/p' f` run in a
# worktree were refused as trunk work. In the session that wrote 191-195 it
# happened about fifteen times, each answered by writing the command into a
# script under .tmp/ and running that — once more while writing this change,
# for `awk '/^}$/'`. Inside single quotes, and after a backslash, nothing
# expands.
#
# Fix: splitPrefix keeps, beside each word, whether it can expand as written
# (wordExpands: a `$` in unquoted or double-quoted text that is not escaped,
# or a `~` in unquoted text at the start — after a redirect operator joined to
# the word, too — or after `=` or `:`), and walkSegments hands it on as
# `literal`. No word is literal when any word of the command names something
# that hands its arguments to a shell again (bash/sh/… -c, eval, source, find,
# ssh, su, sg, watch, parallel, script, tmux, screen, docker) or is a git `!`
# alias: what is single-quoted here is expanded there. Any word, so a wrapper
# the scanner does not unwrap (`setsid sh -c`) is caught too. pathArgs and toAbs judge a literal
# word by its spelling, as any other word; a word that can expand is still
# unresolved. The two guards pass `seg.literal` through. Nothing is newly
# allowed that can expand: `$HOME/x`, `"$HOME"`, `x"$HOME"`, `~/x`, `> "$f"`
# are still refused, and a literal `'../../../README.md'` is still resolved and
# refused as a trunk path.
#
# Review round 1 found two ways the first version let an expansion through:
# `>~/x` (the `~` after a joined redirect operator was taken as text, and bash
# expands it) and `bash -c 'rm $T/x'` (single-quoted for this shell, expanded
# by the next). Both are refused again and are test cases. Round 2 found the
# second still open behind wrappers the scanner does not unwrap (`setsid`,
# `flock`, `docker exec … sh -c`) and through `git -c alias.x='!…'`; every
# word is read now, and both are test cases. A payload that
# reaches the trunk without a `$` (`bash -c 'rm /abs/trunk/x'`) was allowed
# before this change and still is: the header names payloads as opaque.
#
# Also here: the comment on the_review_gate_refuses_what_it_says_it_refuses
# claimed a CI saving that change 194's CI run did not show; corrected, as
# 194's record said the next change to edit src/tests.rs would.
#
# Seen once and not explained: a_session_that_ends_gives_back_only_its_own_
# worktree_leases failed once in six runs of the guard group under load, and
# passed alone and in four more runs. No cause was found, so nothing was
# changed for it; its assertion prints both streams for the next time.
#
# Risk: .cli/hooks and .cli/lib are the gate-configuration surface — high. The
# change narrows what the guard calls unknown to what the shell can expand.

