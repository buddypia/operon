# Review record for 196-a-quoted-dollar-reads-as-a-path-outside.
#
# The change: a word whose `$` or `~` cannot expand as written (single-quoted,
# escaped) is judged by its spelling, so `awk '{print $NF}' f` in a worktree is
# no longer refused as trunk work. No word is literal in a command that hands
# its arguments to another shell.
#
# Round 1, both reviewers probed the guard with built payloads: `>~/x` and
# `bash -c 'rm $T/x'` got through (Important, both). Fixed; both test cases.
# Round 2: the second still open behind wrappers the scanner does not unwrap
# (`setsid sh -c`, `docker exec … sh -c`) and through `git -c alias.x='!…'`
# (Important). Every word of the command is read now; both test cases.
# Round 3: both re-probed the wrappers, the alias, `>~/x`, and the commands the
# change is for; no Important. What is left is carried below, because round 3
# is past the bugfix ceiling.

