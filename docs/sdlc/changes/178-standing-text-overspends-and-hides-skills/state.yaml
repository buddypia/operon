# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Applies Google Research's Harness² rules for always-on text to this
# repository's harness: the 8,000-character budget, a When-line in AGENTS.md
# for every skill, the hooks-file shape check, and the placement order.
#
# Risk: docs/sdlc/bands.yaml is the harness surface (medium, supervised). No
# paused surface is edited: the hook files are read by the new test, not
# changed.

state:
  route: "modify"
  stage: "test"
  status: "reviewing"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Built and verified locally. Next: rust-reviewer on the staged diff,
  review.yaml, commit, then scripts/run-evals.sh against the commit."

contract:
  failing-test-first: "machine passed on main's root documents
    harness_text_every_turn_loads_stays_within_eight_thousand_characters failed
    at 9133 characters, harness_agents_md_says_when_to_read_every_skill for all
    six skills, one_skill_is_the_entry_point_and_the_root_documents_name_it on
    the missing sentence in AGENTS.md, and
    every_document_that_names_the_gates_names_the_same_three on the build
    reference; all pass after (18 named harness tests green)"
  three-gates: "machine passed make q.fast (cargo fmt --check · cargo clippy
    --locked -D warnings) clean; the suite runs in CI on the push"
  bands: "machine passed bash scripts/check-bands.sh: 21 metrics within their
    bands; always_loaded_bytes re-based to 7451 (7401 characters)"
  release-binary: "machine passed no: src/tests.rs and documents only —
    /Applications/Operon.app is not made stale"
  guards-verified-by-mutation: "human passed every_hook_file_has_the_shape_its_cli_dispatches
    failed with each check removed in turn, on the mutant that check owns: an
    unknown event accepted (PostToolUSe), the flat-shape check, the type check,
    the empty-command check; src/tests.rs restored and cmp-identical
    (.tmp/178/mutate.py)"
  evals: "human pending scripts/run-evals.sh over the committed steering"
  review: "human pending rust-reviewer (route modify, craft)"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
