    --locked -D warnings) clean; the suite runs in CI on the push"
  bands: "machine passed bash scripts/check-bands.sh: 21 metrics within their
    bands; always_loaded_bytes re-based to 7395 (7347 characters)"
  release-binary: "machine passed no: src/tests.rs and documents only —
    /Applications/Operon.app is not made stale"
