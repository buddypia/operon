    failed with each check removed in turn, on the mutant that check owns: an
    unknown event accepted (PostToolUSe), the flat-shape check, the type check,
    the empty-command check; src/tests.rs restored and cmp-identical
    (.tmp/178/mutate.py)"
  evals: "human waived no regression against main, which fails the same two:
    004 0/3 at b4b0e94 and 0/3 at main 029eb90, every run stopping on
    feature-pilot's DUPLICATE (send_macos_notification exists); 006 0/1 plus
    2 timeouts here, 0/1 plus 1 timeout on main, the judged runs asking where
