# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Applies Google Research's Harness² rules for always-on text to this
# repository's harness: the 8,000-character budget, a When-line in AGENTS.md
# for every skill, the hooks-file shape check, and the placement order.
#
# Risk: docs/sdlc/bands.yaml is the harness surface (medium, supervised). No
# paused surface is edited: the hook files are read by the new test, not
# changed.

state:
  route: "modify"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Done. The evals were run against main beside this branch and do
  the same on both: 004 and 006 now fail on main too (plan.md, Departures).
  Five reviewer nits carried in review.yaml. No lesson: the in-flight
  contamination was this change's own, and closing it was the fix."

contract:
