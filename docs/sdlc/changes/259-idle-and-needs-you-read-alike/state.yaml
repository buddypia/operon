# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: feature/259-idle-and-needs-you-read-alike.
#
# The idle status group 「指示待ち」 reads like 要対応; it becomes 「手すき」.
#
# Route: modify (placement EXTEND in src/ui/widgets.rs, src/i18n_tables.rs,
# the READMEs and the manuals).

state:
  route: "modify"
  stage: "build"
  status: "in-progress"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Records approved; change the tests first and watch R1 and R3 fail, then widgets, tables, documents."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  release-binary: "machine pending yes: touches src/ui/widgets.rs and src/i18n_tables.rs, so /Applications/Operon.app goes stale and the change ends with bash scripts/package-macos.sh"
  guards-verified-by-mutation: "machine pending each new guard watched failing"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
