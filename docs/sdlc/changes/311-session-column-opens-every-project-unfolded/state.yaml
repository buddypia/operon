# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: modify (the session column's existing fold changes its default, and
# the gap between projects tightens). Risk: low — it paints (risk.yaml
# `drawing`); full autonomy. The arrangement file is a per-machine preference
# beside the store, not the store.
#
# Observed before starting: the running app was again the stale
# /Applications/Operon Stable.app (2026-10-24), started 2026-11-18 13:53,
# which is why pinning, tab moving and the centre-top tab strip looked lost.

state:
  route: "modify"
  stage: "plan"
  status: "planning"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "pending"
  screen: "pending"

resume: "Have the intent evaluated, then write spec.md, screen.md and plan.md."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  release-binary: "machine pending yes: touches src/app/screens.rs and src/ui/session_tree.rs; package and ship from main after landing"
  guards-verified-by-mutation: "human pending each new guard watched failing"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
