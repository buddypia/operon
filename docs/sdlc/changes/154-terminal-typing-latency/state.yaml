# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Cause (root-cause skill): `OperonApp::spawn_background` sends a finished
# job's result down an mpsc channel and never wakes egui, so the frame that
# drains it (`process_background_results`) only runs at the next scheduled
# repaint — `request_repaint_after(100ms)` while any task is pending. A
# keystroke's echo crosses two such hops (send-keys finished -> capture
# requested; capture finished -> drawn), so it reaches the screen 100-200ms
# late, and a further 100ms each time the capture lands before the CLI redrew.
# Change 153 exposed it: until then a focused terminal asked for a repaint every
# frame through `send_viewport_cmd`, which drained the channel at frame rate.
# Waking on completion alone would turn the per-frame
# `select_default_terminal_session` -> `refresh_session_output` call into an
# unbounded capture loop, so the idle poll needs its own interval.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "n/a"

