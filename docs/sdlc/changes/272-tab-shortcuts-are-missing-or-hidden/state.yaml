# The state of one change. See docs/sdlc/templates/state.yaml for the field meanings.

state:
  route: "modify"
  stage: "maintain"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Nothing outlives the change once it is merged on main, packaged with scripts/package-macos.sh, and installed per the ship skill."

contract:
  three-gates: "machine passed make q.fast; cargo test --locked shortcut_272_ (9), the keymap, palette, chord and lesson tests pass; CI re-runs every obligation on the branch head"
  bands: "machine passed check-bands.sh exits 0; steering_bytes and approval_escapes were already breached on main, and largest_module_lines is back at diagnose after the keyboard dispatch moved to src/app/keymap.rs"
  release-binary: "machine passed required - src/app.rs, src/app/keymap.rs and src/app/screens.rs change; package from main after landing"
  guards-verified-by-mutation: "human passed mutations.py 17 of 17 caught, including the notice and the manual row a person reads"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
