# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# The person's words: 「プロジェクト別の区切りやセッションの区切りの見分けが付かない。
# UI/UXを考慮して直して」 and 「セッションの終了するUIもなくて不便」.
#
# Measured on a dev build against a copy of the person's store (1280 × 820):
# the project name is 12px under 13.5px session titles, the gap between two
# sessions equals the gap between two projects, nothing frames a group, the
# row's time is clipped at the column edge, and stop exists only in the open
# terminal's header.

state:
  route: "modify"
  stage: "build"
  status: "in-progress"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Insert the eight tests (drafted in .tmp/tests163.rs) into src/tests.rs, watch them fail, then implement plan.md steps 2-8."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  failing-test-first: "machine pending the eight tests in spec.md fail on main
    for their stated reasons before the code changes"
  guards-verified-by-mutation: "machine pending mutations.py: each mutation in
    plan.md turns a test red"
  screen-matches: "human pending a screenshot of the dev build against a copied
    store matches screen.md"
  review: "human pending rust-reviewer at the digest of the whole change"
  release-binary: "machine pending yes — src/app/screens.rs changes; ends with
    bash scripts/package-macos.sh and the swap after landing"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
