# Review record for 168-live-restore-tests-leave-conversations-behind.
#
# The change: the six live restore tests keep their projects under /tmp (a
# guard checks the base and scans every live test for `temp_dir()`), start
# their terminals one at a time, and take back the conversation each wrote into
# another CLI's store — Antigravity's file with its SQLite sidecars, Codex's
# thread through Codex's own `thread/delete`.
#
# Round 1: rust-reviewer approved and found that the guard checked only the
# helper, not that the tests used it; a doc comment had been left on the
# wrong item; removal failures were silent; and Codex might keep more than the
# rollout. Round 2 added the source scan (watched failing on one root mutated
# back), moved the comment, printed failures other than NotFound, and — after
# measuring 127 test rows in Codex's thread index — deleted threads through
# the app server, after which a full run left the count unchanged.
#
# Verified by rust-reviewer: everything changed is test code or #[cfg(test)];
# the thread id is the one the app server returned through
# is_safe_cli_session_id, so only the test's own thread can be named; the
# app server is stopped whether or not the delete succeeds; poison on the
# terminal lock is recovered.

