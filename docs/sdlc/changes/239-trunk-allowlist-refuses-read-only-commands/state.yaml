# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Bug report (it is the intent on this route):
# 1. Since the allowlist last moved (change 173, 2026-10-17),
#    .claude/state/governance-events.jsonl holds 439 trunk-allowlist refusals.
#    Replayed through the current policy, 6 pass; most of the rest are
#    correct (writes on main, interpreters, `$VAR` paths). About 85 are reads
#    that change nothing, each a retry or a detour for the session:
#    `rg` (15), `git ls-remote --heads origin` (12), `git pull --ff-only`
#    on landing (9), `git branch -r|-a --list`, `--contains`, `--format` (8),
#    `sleep` (8), `mktemp -d` (5), `tr` (5), `readlink`, `paste`, `du`,
#    `strings`, `md5`, `sha256sum`, the secret-guard redact filter the
#    person's own instructions require after `ps` (3), `gh api` reads (3),
#    `bash scripts/check-approvals.sh --list` (3).
#    The person asked for it on 2026-11-01 (「一つずつやって」, answering the
#    mechanism audit's first proposal).
# 2. Cause: the list never named these reads, and the `git branch` patterns
#    take `--list` only first and no `-r`/`-a` before it.
# 3. Kept out on purpose, as 095 and 131 decided: awk and sed beyond line or
#    regex prints (their scripts write and run programs), `python3`/`node`
#    payloads, redirects into files, `git -C <dir>` in front of a transport
#    (also when the dir is the trunk itself: 14 refusals, recorded in resume).

state:
  route: "bugfix"
  stage: "build"
  status: "in-progress"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "paused"
  risk: "high"
  readiness: "go"
  screen: "n/a"

resume: "Plan approved (approvals.log). Next: extend the test, watch it fail, then edit the policy and the guard."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  failing-test-first: "machine pending the_trunk_allowlist_and_the_ownership_check_are_switched_on_here refuses a listed read on the unedited policy"
  release-binary: "machine waived touches .claude/config, .cli, docs/sdlc, and src/tests.rs only"
  guards-verified-by-mutation: "human pending each new exclusion watched failing"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
