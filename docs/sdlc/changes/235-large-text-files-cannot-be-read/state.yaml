# The state of one change. Field meanings: docs/sdlc/templates/state.yaml.

state:
  route: "modify"
  stage: "test"
  status: "reviewing"
  attempts: "1 3"
  questions: "1 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "approved"

resume: "Get the person's approval line for spec.md (the spec category is demoted), push, wait for CI, then land and package."

contract:
  three-gates: "machine pending bash .claude/hooks/gate-commit.sh"
  bands: "machine pending bash scripts/check-bands.sh"
  named-tests: "machine passed seven new and two updated tests plus 214 editor, document, file and policy tests locally"
  release-binary: "machine pending touches src/ beyond src/tests.rs, so /Applications/Operon.app goes stale; ends with bash scripts/package-macos.sh and the ship swap"
  installed-app: "human pending a 748 KiB HTML file opened from the Sessions Files tab shows numbered, coloured, read-only source and scrolls to its end"
  guards-verified-by-mutation: "human passed mutations.py 10/10 caught, including the row-height and two claim mutations; source restored"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
