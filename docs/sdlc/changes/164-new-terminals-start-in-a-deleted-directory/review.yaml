# Review record for 164-new-terminals-start-in-a-deleted-directory.
#
# The change: every pane Operon starts — agent or plain terminal — changes into
# its own directory before running anything (`tmux_pane_command`), because a
# tmux server whose starting directory was deleted starts panes there whatever
# `-c` says; and every tmux client runs from `/`, so a server Operon or the
# suite starts never holds a directory a worktree cleanup can delete.
#
# Round 1: both reviewers asked for plain terminals to get the same guard —
# they are what "new terminal" means and the person's server was already
# broken. subprocess-safety-reviewer also found that `cd && command` lets an
# `||` in the command run it elsewhere. Round 2 routed start_empty_tmux_session
# through the guard with `exec "$SHELL" -l`, changed the guard to
# `cd -- <dir> || exit 1; <command>`, and put a quote and a space in the test
# paths plus a missing-directory case (mutated back to `&&`, it fails).
#
# Verified by rust-reviewer: launch paths only, all on background threads; no
# new unwrap/panic outside tests; borrowed signatures; the tests clean up
# before asserting.
#
# Verified by subprocess-safety-reviewer: every caller hands the guard a
# simple command; nothing reads pane_current_command or pane_start_command, so
# the plain terminal's new start command breaks no detection; every `-c` gets
# an absolute path, so running tmux from `/` changes no resolution; the argv
# form was declined because handing agent commands to /bin/sh instead of the
# person's default shell would stop reading ~/.zshenv.

