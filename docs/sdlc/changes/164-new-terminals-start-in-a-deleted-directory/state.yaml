# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: found in the final verification of 159-161. Live restore tests
# failed with "The current working directory was deleted" (Claude Code) and
# "No such file or directory (os error 2)" (Codex) — the same symptom change
# 160 waived as a stale test server. On this Mac the person's own default tmux
# server, the one Operon launches every agent on, was running from a deleted
# worktree too (fix/159-…, started 10/14 21:38): a pane created there with
# `-c /tmp` printed "." for `pwd` and `/bin/pwd` failed. So every terminal
# Operon opened at that point started its agent in a directory that no longer
# exists.
#
# Cause (root-cause skill), measured on tmux 3.8 with private servers:
# - a tmux server keeps the working directory of the client that started it;
# - once that directory is deleted, a pane started there — new-session or
#   respawn-pane, with an absolute `-c` — runs in the deleted directory
#   (PWD=.), not in `-c`; tmux master's spawn.c shows no path that does this,
#   so it is recorded as measured, not explained;
# - `tmux_command` set no working directory, so a server Operon or `cargo test`
#   started inherited the caller's — a worktree that cleanup-worktree deletes.
#   The suite's own `-L operon_suite` server was in the deleted
#   chore/install-159-160 worktree, and before that in 155's (change 160's
#   waiver): the second time.
# - Reproduced: a fresh suite server passes
#   codex_app_server_restores_a_short_transcript_into_a_resumable_terminal; a
#   suite server started from a directory that is then deleted fails it.
#   `cd -- '/tmp' && …` as the pane command lands in /tmp on the same server.
#
# Fix: every pane Operon starts — agent and, after review round 1, plain
# terminal — runs `cd -- <dir> || exit 1;` first, which holds on a server that
# is already broken; and every tmux client runs from `/`, so a server Operon or
# the suite starts never holds a deletable directory.

