# Risk: low — risk.yaml `drawing` (src/ui, src/glyphs.rs, src/app/), full
# autonomy; it paints, so screen.md is judged by an evaluator.

state:
  route: "modify"
  stage: "build"
  status: "in-progress"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Write the session_283_ tests and the session_badge widget, then rewrite the earlier tab tests."

contract:
