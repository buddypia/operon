  release-binary: "machine pending required - src/ui/widgets.rs, src/glyphs.rs and src/app/screens.rs change"
  guards-verified-by-mutation: "machine pending python3 docs/sdlc/changes/283-session-icons-read-as-two-marks/mutations.py"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
