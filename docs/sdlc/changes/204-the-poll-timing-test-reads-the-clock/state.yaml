# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/204-the-poll-timing-test-reads-the-clock.
#
# Report: CI run 39730353874 (change 203's branch) failed
# test_fast_subprocess_completes_without_25ms_polling_floor: "the fastest of 8
# fast commands 9.481375ms, waited for directly 1.996875ms". The branch did not
# touch src/exec.rs, and a rerun of the same commit passed.
#
# Cause: the test's wall-clock bound, helper < blocking * 2 + 5 ms, holds only
# if a 1 ms thread::sleep returns within about 1 ms. On a loaded macOS runner it
# returns several ms late, so the bound measured the runner. Change 201 had
# already moved this test from a fixed bound to this relative one.
#
# Fix: the clock comparison is gone. The test reads the three things a polling
# floor needs from src/exec.rs: the first sleep, its doubling, and the sleep
# the loop takes (the third is new). Lesson 094.

