# STEERING_BYTES CROSSED INTO `diagnose`, and this is the read-only
# investigation that tier asks for: what moved, and when.
#
# What moved: all of it, and it is this change's own lesson. docs/sdlc/
# lessons.md went 126296 -> 131272 bytes, a delta of 4976, of which 4975 is
# entry 041 measured heading-to-heading with its separator — the convention
# docs/sdlc/bands.yaml fixes for this figure. Nothing else steering_bytes counts
# was touched: CLAUDE.md, AGENTS.md, DESIGN.md, CONTRIBUTING.md, REVIEW.md,
# .claude/agents/*.md, .claude/skills/*/SKILL.md, docs/sdlc/*.md and
# docs/sdlc/templates/*.md are all unchanged by this change.
#
# When: at this commit. 259333 -> 264309 against a diagnose threshold of 264000,
# so the crossing is 309 bytes wide and one entry caused it.
#
# What it means, which bands.yaml already wrote down before it happened: "If it
# is reached by lessons alone the answer is not another re-base: it is that the
# format is the cost." It was reached by lessons alone. The rate has improved —
# entries 036-041 are 27229 bytes across six, 4538 an entry, against the 6450
# recorded for 019-024 — but 41 entries at 4538 is 130031 bytes, which is 99 %
# of lessons.md and about half of steering_bytes.
#
# Not done here, deliberately, and both for the reason bands.yaml gives about
# itself: the baseline is not re-based (a baseline edited to match today is not
# a baseline), and entry 041 is not trimmed to fit under 264000 (correcting a
# gate in order to pass it is the wrong way round). `propose` is at 316000,
# which at 4538 an entry is about eleven entries away. The answer at that point
# is a format change, and it belongs in its own change with its own intent.md,
# not in a bugfix about a restore notice.

