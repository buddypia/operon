# READINESS IS `pending` AND STAYS `pending`, which is a statement about the
# gate rather than about this change. `scripts/check-readiness.sh` returns
# No-Go here on `intent.md がありません`, and the `bugfix` route skips stage 1
# by design: docs/sdlc/routes.yaml gives it `build,test`, and
# .claude/skills/sdlc/SKILL.md says "the bug report is the intent". The script
# does not read routes.yaml at all — its first phase returns on a missing
# intent.md before anything else is judged — so no bugfix can reach Go. Every
# bugfix on this branch records `pending` for the same reason (055, 059, 060,
# 064, 065, 066), which makes it a pattern and not an exception.
#
# Not fixed here, deliberately: check-readiness.sh is change 050's surface and
# fixing a gate while using it is how a gate stops being evidence. Recorded so
# the next reader knows `pending` is measured and not skipped.
#
# The measurement, 2026-09-21 on this tree:
#   readiness: No-Go — 1 blocking, 0 warning
#   blocking  …/061-…: intent.md がありません

