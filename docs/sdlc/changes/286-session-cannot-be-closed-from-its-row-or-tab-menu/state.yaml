  stage: "plan"
  status: "ready"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Write the four session_286 tests in src/tests.rs and watch them fail, then follow plan.md."

