# Change 298. Bug report, as the bugfix route takes it in place of an intent:
#
# The landing steps say to wait for CI with `gh run watch` right after
# `git push`. GitHub registers the push's run a few seconds later, so the first
# `gh run watch` / `gh run list --commit` finds no run, and the session falls
# back to asking again by hand, one tool call each time. Change 297's landing
# spent 219 turns polling that way. Nothing in the repository waits for the run
# to appear before watching it.

