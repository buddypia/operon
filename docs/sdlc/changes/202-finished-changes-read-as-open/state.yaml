# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/202-finished-changes-read-as-open.
#
# Report (the person, 2026-10-22): thirty change records still said a change was
# open; go through them one by one, miss nothing, and fix what they hide for good.
#
# Cause: all thirty arrived open in the squashed import 6ebed6a (2026-10-05), and
# .claude/hooks/gate-merge.sh reads only the change directories a branch
# touches, so nothing read them again. Reproduced by
# merge_gate_refuses_branch_with_in_flight_state_yaml, which had a record open on
# main from its first line and passed.
#
# What this change does: reads each record against the code (triage.md), closes
# twenty-eight as done and archives 038 and 040 with the reason, and makes the
# merge gate read every record on the branch. The defects the reading found are
# A1-A19 in triage.md; they touch src/ and land as changes of their own.

state:
  route: "bugfix"
  stage: "deploy"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "high"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Two remarks are carried in review.yaml; neither needs
  anything from the person. Closed in the same commit that CI judges last."

contract:
  failing-test-first: "machine passed the new assertions in
    merge_gate_refuses_branch_with_in_flight_state_yaml failed with the new
    check removed; mutations.py here caught 4 of 4"
  three-gates: "machine passed cargo fmt and the named test; clippy and the
    record tests at the commit; the suite runs in CI"
  ci: "machine passed on the tip, which the merge gate checks"
  release-binary: "machine passed no: a hook, a script comment, docs and
    src/tests.rs only"
  review: "human passed rust-reviewer approve 0 0 and
    subprocess-safety-reviewer approve-with-nits 0 1 at 0a75782d4e7dfd43
    (round 2), two remarks carried in review.yaml"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
