# Change 314. The person asked (2026-11-23) that the mechanism of two sources be
# analysed and applied to this project: the pstack plugin and Lauren Tan's talk
# "All Code Is Slop (Except Mine)". The analysis found most of it already here
# (evidence instead of verdicts, exhaustive models and Kani, lessons with
# guards, the feature documents) and three layers missing. This change builds
# the largest: nothing drives the built application and keeps what it showed.
#
# Decisions taken by the managing session, recorded as such: the two smaller
# gaps (an empty lint layer; comments that carry rules nothing enforces) are
# left for changes of their own, and the steps live in a reference of the
# feature-pilot skill rather than a new skill, because a new skill costs a
# When-line in AGENTS.md and the text every turn loads is 18 bytes under its cap.

state:
  route: "feature"
  stage: "test"
  status: "awaiting-user"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "n/a"
  features: "none"

resume: "Built, verified, pushed. Waiting for the person: the intent was escalated (which of the three gaps to build first was this session's choice), so nothing lands until they say yes. On yes: git merge --no-ff --no-edit on main once CI is green, push, cleanup-worktree. No ship step: nothing in the bundle changed."

contract:
  three-gates: "machine passed bash .claude/hooks/gate-commit.sh"
  bands: "machine passed bash scripts/check-bands.sh; reference_bytes enters warn (recorded, no action), the rest as on main"
  release-binary: "machine waived touches scripts/, docs/, .claude/skills and src/tests.rs only; none is in the bundle"
  guards-verified-by-mutation: "human passed 30 of 30 caught, python3 docs/sdlc/changes/314-nothing-proves-a-change-in-the-running-app/mutations.py"
  journeys-run-against-the-built-app: "human passed home, palette, settings, project-list, terminal-pane: three runs each in a row exit 0 on this machine; nothing left running, the data folder's modification time unchanged; pictures under target/verify/"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
