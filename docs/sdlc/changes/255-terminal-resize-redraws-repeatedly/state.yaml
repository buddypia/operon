# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: modify. Risk: low (risk.yaml `drawing`: src/app.rs, src/ui), full
# autonomy; the change paints, so screen.md is agreed first.

state:
  route: "modify"
  stage: "test"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Land after CI passes on the branch, then package from main per the ship skill."

contract:
  three-gates: "machine passed make q.fast, session_255_ (5), terminal and resize test filters"
  readiness: "machine passed bash scripts/check-readiness.sh docs/sdlc/changes/255-terminal-resize-redraws-repeatedly"
  release-binary: "machine passed required - production src changes; package from main after landing"
  guards-verified-by-mutation: "machine passed mutations.py 8 of 8 caught, rerun independently by empirical-verifier"
