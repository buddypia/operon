# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/205-the-find-bar-and-the-commit-box.
#
# Report: change 202's reading of the open records (triage.md there, A4, A6,
# A7, A8).
#
# A4. One commit message field served every project: a draft written or asked
#     for in one project was the message under the next project opened, and
#     a commit there emptied it. Reproduced by
#     a_commit_message_stays_with_the_project_it_was_written_for.
# A6. A closed find bar is not searched when the buffer moves, and ⌘F did not
#     search it again, so the bar reopened on the count from when it closed.
#     Reproduced by reopening_the_find_bar_counts_what_arrived_while_it_was_closed.
# A7. A single-line field gives up the keyboard on Enter, so Enter never
#     stepped; the conversion check read the pane's preedit, not the field's;
#     Esc closed the bar mid-conversion and left the keyboard nowhere; the
#     close icon was a raw button. Reproduced by
#     the_find_bar_steps_on_enter_but_not_on_a_conversions_enter and
#     esc_closes_the_find_bar_into_the_pane_but_not_mid_conversion.
# A8. The empty projects page typed ⌘O into its hint, wrong once project.add
#     is rebound; an unused message row typed it too. Reproduced by
#     no_message_spells_a_remappable_chord, which reads every source file but
#     the keymap and the tests for a default chord outside a comment.
#
# Fix: the message is kept per project. ⌘F searches again as it opens. The
# field has no return key; find_bar_step reads the frame's events the way the
# pane does (one Enter per confirmed conversion, none while a preedit shows),
# and the field keeps whether a conversion is open. Esc beside or during a
# conversion is the IME's and the field takes the keyboard back from egui;
# otherwise it closes the bar and hands the keyboard to the pane. The close
# icon is small_icon_button. The hint reads the keymap.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Two remarks are carried in review.yaml; neither needs
  anything from the person. Closed in the same commit that CI judges last."

contract:
