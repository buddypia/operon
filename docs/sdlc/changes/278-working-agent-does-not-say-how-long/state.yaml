# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: feature (a time no row said before). Risk: low — risk.yaml `drawing`
# (src/app.rs, src/app/screens.rs) and `text`; full autonomy; the change
# paints, so screen.md is agreed first.

state:
  route: "feature"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Done. Package from main after landing."

contract:
  three-gates: "machine passed make q.fast and cargo test --locked working_278_"
  bands: "machine passed bash scripts/check-bands.sh"
  release-binary: "machine passed required - src/app.rs, src/app/screens.rs and src/app/working_time.rs change; packaged from main with the changes that follow it"
  guards-verified-by-mutation: "machine passed python3 docs/sdlc/changes/278-working-agent-does-not-say-how-long/mutations.py"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
