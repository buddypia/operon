# Review record for 161-new-terminal-opens-with-a-stray-ctrl-d.
#
# The change: once the placeholder `cat` is dead, `retire_tmux_placeholder`
# resets the pane and clears its history in one tmux call, so the "^D" its
# end-of-file echoed is gone before the agent is respawned.
#
# Round 1: both reviewers approved, and both found that a failure of this
# cosmetic step killed a launch that would otherwise have worked, and that on
# a wait timeout the clear could run against a live `cat`. Round 2 moved the
# call into `clear_retired_placeholder`, run only after the pane was seen
# dead, with its result ignored.
#
# Verified by rust-reviewer: launch path only, off the frame; no new
# unwrap/expect/panic outside the test; the ignored result is argued at the
# function; the test reads scrollback, so dropping either half of the call
# fails it.
#
# Verified by subprocess-safety-reviewer: the clear runs strictly before the
# respawn; `;` is its own argv element, as in tmux_capture_with_cursor; the
# target is the hex-only managed name; the 5 s timeout kills and waits the
# child; the suite stays on its own `-L operon_suite` server.

