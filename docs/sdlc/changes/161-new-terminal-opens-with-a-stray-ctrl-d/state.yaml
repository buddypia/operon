# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: found while running the live restore tests after 159 and 160 were
# installed. Every agent terminal Operon opens now starts with a line reading
# "^D" above the agent's own output; Claude Code draws inline, so the line
# stays in view and in the scrollback.
#
# Cause (root-cause skill): change 160 ends the placeholder `cat` with
# `send-keys C-d`. The pane's tty is in canonical mode with echoctl on, so the
# line discipline echoes the EOF as "^D" before `cat` reads it, and
# `respawn-pane` keeps the dead pane's grid: tmux re-initialises the cursor,
# not the cells. Measured on tmux 3.8, private server: after the C-d and the
# respawn, `capture-pane -S -100` shows "^D" on line one. `send-keys -R` alone
# scrolls it into the history (still captured); `clear-history` alone leaves
# it on screen; the two together leave nothing.
#
# Fix: once the placeholder is seen dead, reset the pane and clear its history
# in one tmux call, before the respawn. The call is best-effort: a failure
# leaves the stray line, never fails the launch (review round 1).

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Package and swap into /Applications after the merge."

contract:
