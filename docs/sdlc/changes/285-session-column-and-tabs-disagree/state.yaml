# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: feature (pinning does not exist; the single list it needs is the
# same change). Risk: low — risk.yaml `drawing` and `text`; full autonomy.
# It paints and re-arranges the column's order, so screen.md goes to the person.

state:
  route: "feature"
  stage: "test"
  status: "reviewing"
  attempts: "0 3"
  questions: "3 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Have empirical-verifier try to falsify the change, fix what it reproduces, then close and land."

contract:
  three-gates: "machine passed make q.fast; full suite 1343 passed, 6 ignored"
  bands: "machine passed bash scripts/check-bands.sh: nothing at propose; largest_module_lines at diagnose as on main, src/app.rs shrinks to 9901"
  release-binary: "machine pending required - src/app.rs, src/app/screens.rs, src/ui/session_tree.rs and src/i18n_tables.rs change; package from main after landing"
  guards-verified-by-mutation: "machine passed 17 of 17 caught: python3 docs/sdlc/changes/285-session-column-and-tabs-disagree/mutations.py"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
