  stage: "deploy"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "low"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Four remarks are carried in review.yaml; none needs anything
  from the person. Closed in the same commit that CI judges last."

contract:
  failing-test-first: "machine passed mutations.py here, 7 of 7 caught: no
    record test run, the whole suite run instead, docs/ not a trigger, a limit
    of their own, a listed name renamed away, a run matching no test passing,
    fixtures back under $TMPDIR. The gate itself refused with exit 2 on this
    state.yaml with `stage: review` and on a listed name moved to another
    module, and passed in 14 seconds on the change as it is"
  three-gates: "machine passed cargo fmt and the named tests; clippy and the
    record tests at the commit; the suite runs in CI"
  ci: "machine passed on the tip, which the merge gate checks"
  release-binary: "machine passed no: a hook, docs and src/tests.rs only"
