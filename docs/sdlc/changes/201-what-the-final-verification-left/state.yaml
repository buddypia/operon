# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch:
# fix/201-what-the-final-verification-left.
#
# Report (the person, 2026-10-22): fix what the final verification left open,
# permanently, then land and clean up.
#
# 1. A change number held only inside an unnumbered branch. The dependency
#    update committed docs/sdlc/changes/199-… on chore/update-dependencies-latest
#    at 10:49; 199 was opened again minutes later, because
#    scripts/check-change-number.sh read change directories on main alone and
#    branch names. It now reads the change directories at the tip of every
#    local and origin branch.
#
# 2. test_fast_subprocess_completes_without_25ms_polling_floor failed under
#    load, in CI once and here: four calls under a fixed 85 ms took 100-400 ms
#    for eight at a load average of 58-85. It now reads the poll's first sleep
#    from src/exec.rs (no load moves that) and compares the calls with the same
#    command waited for by a blocking status(), taken in turn.
#
# 3. a_session_that_ends_gives_back_only_its_own_worktree_leases failed once.
#    Reproduced with a git that takes 4 s: SessionEnd's `git worktree list` ran
#    on a 3 s budget, and a timeout reads as no worktrees, so every lease stayed
#    held for the 2-hour TTL — in production too, keeping other sessions out.
#    The release now waits 8 s of the hook's 10, pinned against settings.json,
#    and node_in sets the patience floor .cli/lib/utils.mjs keeps for tests.
#
# 4. Change 198's four remarks. The comment on the commit gate's limit now says
#    how clippy and the record tests share it. A commit that deletes or moves a
#    path runs the record tests (rename detection lists only the new path). The
#    record tests' refusal says they read the working tree. The 212 fixtures
#    that called temp_dir() take temporary_root(), and node fixtures get it as
#    TMPDIR: the third time a $TMPDIR inside this repository broke a test
#    (changes 168, 198), now held by fixtures_take_their_root_from_one_place.
#
# 5. Cleanup: the superseded fix/199-a-merge-lands-where-the-main-checkout-is
#    (its content landed as 200) is removed with its worktree.
#
# Risk: low. No application code: src/tests.rs, hooks, one script, records.

state:
  route: "bugfix"
  stage: "deploy"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "low"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Two remarks are carried in review.yaml; neither needs
  anything from the person. Closed in the same commit that CI judges last."

contract:
  failing-test-first: "machine passed each new assertion failed first: the
    number check on the old script, the lease test with a 4 s git, the move
    trigger in a probe repository; mutations.py here caught 8 of 8"
  three-gates: "machine passed cargo fmt and the named tests; clippy and the
    record tests at the commit; the suite runs in CI"
  ci: "machine passed on the tip, which the merge gate checks"
  release-binary: "machine passed no: hooks, a script, docs and src/tests.rs
    only"
  review: "human passed rust-reviewer approve 0 0 and
    subprocess-safety-reviewer approve-with-nits 0 1 at 12028a68b46ea47d
    (round 2), two remarks carried in review.yaml"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
