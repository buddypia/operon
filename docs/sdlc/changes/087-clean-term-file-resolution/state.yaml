# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Bug report (it is the intent on this route):
# 1. Terminal file resolution was conflated with project document containment,
#    forcing open_terminal_target_external to hack around resolve_session_terminal_path
#    and breaking right-click path actions on external files.
# 2. check-readiness.sh blocked bugfix changes due to unconditional intent.md check.
# 3. the_trunk_allowlist_and_the_ownership_check_are_switched_on_here timed out at 30s.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "full"
  risk: "low"
  readiness: "pending"
  screen: "n/a"

resume: "Landed. Clean separation of terminal file and document resolution, robust test timeouts, and aligned readiness check."

contract:
  reviewed: "human passed reviewed by developer"
  three-gates: "machine passed cargo fmt, cargo test, and clippy pass"
  failing-test-first: "machine passed test_terminal_session_file_resolution_separation verified"
  bands: "machine passed control bands within budget"
  release-binary: "machine passed release package built via scripts/package-macos.sh"
  guards-verified-by-mutation: "machine passed mutations verified"
  lesson-recorded: "machine waived not needed for single bugfix change"
