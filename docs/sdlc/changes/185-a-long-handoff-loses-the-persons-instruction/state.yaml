# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# A handoff bundle over its byte budget was cut from the end, which is where
# the person's handoff instructions sit, and every cut it made was a bare `…`
# the receiving session could not tell from the source's own text. Harness²
# marks each cut in what an agent reads as its own (core/context.py).
#
# Risk: src/history.rs is the foreign-store surface (medium, supervised);
# src/config.rs and src/tests.rs match nothing higher.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "go"
  screen: "n/a"

resume: "Done once landed and shipped: two reviewer findings carried in
  review.yaml for a follow-up, the byte fallback cutting through an old
  marker among them."

contract:
  live-restore: "machine passed cargo test --locked -- --ignored: 6 of 6"
  failing-test-first: "machine passed a_long_handoff_keeps_the_persons_instruction_whole
    failed on main's builder (the person's handoff instructions were cut) and
    a_handoff_says_where_operon_shortened_the_text on the bare ellipsis (a
    shortened turn does not say Operon shortened it)"
  three-gates: "machine passed make q.fast (cargo fmt --check · cargo clippy
    --locked -D warnings) clean; cargo test --locked handoff 15 ok; the suite
    runs in CI on the push"
  bands: "machine passed bash scripts/check-bands.sh: 20 of 21 within band;
    largest_module_lines warns at 8856 for src/app.rs, untouched here (warn:
    recorded, no action)"
  release-binary: "machine passed yes: touches src/history.rs, src/config.rs,
    src/agents.rs; package /Applications/Operon.app from main after merge with
    bash scripts/package-macos.sh and the ship skill's swap"
  guards-verified-by-mutation: "human passed 7 of 7 caught by mutations.py in
    this directory: the end-cut put back, the bare ellipsis, the byte overrun,
    the last turn dropped, the task shortened before the excerpt, a second cut
    through an earlier marker, and the marker shown in the session name; tree
    restored"
  review: "human passed round 2 at 3c512ce505fc05eb: rust-reviewer and
    subprocess-safety-reviewer approve-with-nits 0 1 each, two nits carried"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
