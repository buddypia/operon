# Change 299. Bug report, as the bugfix route takes it in place of an intent:
#
# A subagent started with `isolation: "worktree"` (empirical-verifier,
# formal-verifier — both are told to run that way) cannot work in its tree.
# Claude Code puts the tree at `<repo>/.claude/worktrees/<name>`, and every
# worktree guard here recognises a worktree only under `.worktrees/`; with
# CLAUDE_PROJECT_DIR naming the main checkout, the guard asks main's branch,
# reads `main`, and refuses the subagent's commands and edits as trunk work.
# Changes 296 and 297 both record a verifier refused that way and reporting
# from reading only, so neither had its claims tested by experiment.

