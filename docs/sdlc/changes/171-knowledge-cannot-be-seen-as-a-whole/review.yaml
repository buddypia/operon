# Review record for 171-knowledge-cannot-be-seen-as-a-whole.
#
# Round 1: rust-reviewer do-not-approve (1 Important): apply_knowledge_map kept
# the old map on Err while map_for moved to the new snapshot, so an 8-point map
# could be drawn beside 3 entries and a hover or an edge index past them would
# panic the frame. Fixed: the map is dropped on Err, and ui_knowledge_map draws
# only a map whose points match its snapshot's entries one to one
# (knowledge_map_that_failed_for_fewer_entries_is_not_drawn, watched failing
# with each half reverted). Its minor 2 and durability-reviewer's minor 1 were
# the same finding — a failed layout save threw away a computed map — and were
# taken: the save is now best-effort (derived data). durability-reviewer's
# minors 2 and 3 were taken too: non-finite points are never saved, and a
# failed save is shown to leave the previous rows
# (knowledge_map_save_that_fails_keeps_the_previous_layout).
#
# Round 2: both re-read and approve. durability-reviewer raised one more minor —
# a NaN vector still reached the painter — taken in round 3: a non-finite
# vector counts as no vector and goes on the outer ring; the test asserts every
# point is finite, watched failing with the filter disabled.
#
# Round 3 (this digest): rust-reviewer and durability-reviewer confirm the
# delta. subprocess-safety-reviewer, named by the gate for src/knowledge.rs,
# read the whole staged diff: no Command::new, no unsafe, no PATH handling in
# shipped code; approves with two minors carried below.

