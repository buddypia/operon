# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report: Antigravity (agy 1.1) reads a hook's answer as protojson. One key it
# does not know and the whole answer is dropped; a PreToolUse answer that
# carries `decision` has its `deny_reason` ignored; `{}` is an answer too, and
# wipes the reason a later hook gave. .cli/lib/cli-adapter-utils.mjs answered a
# refusal as `{decision: "deny", reason}` and a notice as `{systemMessage}`, so
# a `run_command` the guards refused reached the agent with no reason, and each
# Stop and PostToolUse was a hook error. `executionNum` counts from 0, which the
# adapter read as 1-based. The Stop entry in .claude/hooks.json ran
# `$(git rev-parse --show-toplevel)` — the branch's own .cli/ inside a linked
# worktree (sdlc 051's review) — and named no hook.
#
# Fix: the adapter answers a refusal as `{allow_tool: false, deny_reason}`,
# keeps ask, prints nothing for allow, notices and PostToolUse, and turns a
# Stop block into `{decision: "continue", reason}`; `executionNum > 0` is
# stop_hook_active and a Stop the person cancelled (USER_CANCELED) is not run.
# The change is brief2dev's (fix/antigravity-hooks-contract, 19b79774), applied
# as a patch: .claude/.bundle-receipt.json's reapply command does not run here,
# and a re-transplant would undo this copy's wording. The Stop entry runs the
# trunk checkout's dispatcher and names its hook, as the others do.
#
# Risk: written when .cli/ and .claude/hooks.json were on no surface (medium,
# supervised, as 173 and 174). Change 175 landed on main first and put both on
# gate-configuration, so merging main makes this high and paused: the parts of
# the diff approval.md files under relaxation, or under a change to what the
# judge reads, are the person's to approve; the reviewers' split decides which.

state:
  route: "bugfix"
  stage: "test"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "paused"
  risk: "high"
  readiness: "go"
  screen: "n/a"

resume: "Done. What outlives it: seven findings carried in review.yaml
  for a follow-up change — the adapter's skip and empty-output wiring and the
  guard's own reason are pinned by no test, PreToolUse advice no longer
  reaches Antigravity, and a future blocking Stop guard would rest on
  executionNum restarting at 0 and would not run on a cancelled turn."

contract:
  failing-test-first: "machine passed 0f62b19 adds
    antigravity_hears_a_guard_only_in_the_shapes_it_reads,
    a_refused_run_command_reaches_antigravity_with_its_reason and
    every_antigravity_entry_runs_the_trunk_copy_of_its_guard; against main's
    adapter they failed for the stated reasons (deny answered as
    {decision, reason}; the Stop entry runs --show-toplevel)"
  three-gates: "machine passed cargo fmt --check · cargo clippy --locked -D
    warnings at 7d8eca4; cargo test --locked 919 passed, 4 failed, none of them
    this change's: the_commit_gate_runs_the_gates_in_the_tree_the_commit_lands_in
    and the_stop_gate_reads_the_tree_the_session_is_working_in fail the same
    on main c846418 here; the_installed_usage_reader_posts_a_reading_end_to_end
    is the session's TMPDIR making the socket path too long, and
    test_fast_subprocess_completes_without_25ms_polling_floor a timing bound at
    load average ~40. The suite runs in CI"
  release-binary: "machine passed no: .cli/, .claude/hooks.json and
    src/tests.rs only — /Applications/Operon.app is not made stale"
  guards-verified-by-mutation: "machine passed each new test watched failing
    against main's adapter and hooks.json"
  review: "human passed rust-reviewer and subprocess-safety-reviewer
    approve-with-nits at 69407b29ccde6ab0, the landing diff with main's 175;
    gate-configuration approved by the person in approvals.log"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
