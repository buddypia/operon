# Review record for 176-antigravity-throws-away-what-a-guard-says.
#
# The change: .cli/lib/cli-adapter-utils.mjs answers Antigravity in the result
# shapes agy's protojson reads — a refusal as {allow_tool: false, deny_reason},
# ask kept, nothing for allow, notices and PostToolUse, a Stop block as
# {decision: "continue", reason}; executionNum > 0 is stop_hook_active and a
# USER_CANCELED Stop is not run. The Stop entry in .claude/hooks.json runs the
# trunk checkout's dispatcher and names its hook, as the other entries do.
#
# Reviewed on the landing diff, after main's change 175 was merged in: 175 put
# .cli and .claude/hooks.json on gate-configuration, which adds
# subprocess-safety-reviewer to the route's rust-reviewer. Its split in
# approval.md's terms: no relaxation; the deny reason delivered, the dropped
# automatic `allow`, and the trunk-pinned Stop entry are tightenings; ask, the
# Stop continue (unreached today: applyStopAdvisoryPolicy downgrades every
# Stop block while data/registry/harness-budget.json is absent), > 0 and the
# USER_CANCELED skip are neutral. Both ran the three new tests green; the
# merge adds to src/tests.rs and removes nothing.

