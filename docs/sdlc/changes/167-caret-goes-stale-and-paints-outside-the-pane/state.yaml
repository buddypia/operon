# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Cause (root-cause skill), two named defects found by the adversarial pass
# over landed change 155, both with demonstrations:
#
# 1. A capture whose marker segment is missing leaves the previous cursor in
#    `terminal_cursors` forever: `set_session_output` (src/app.rs) inserts only
#    `if let Some(cursor)`, and nothing removes the entry but session teardown.
#    tmux demonstrably exits 0 with no marker line when the display-message
#    segment loses its target mid-invocation, so `cursor: None` arrives while
#    the pane is alive — and the stale `TerminalCursor` then maps old
#    pane_rows/y onto every new buffer length: the box parks rows into
#    scrollback indefinitely, the exact wrong-box outcome 155 exists to
#    prevent. The same path is what lets a pane-echoed marker (rfind takes the
#    last occurrence; the real one is missing) persist as a spoofed cursor.
#
# 2. The caret rect 155 returns is drawn on the outer painter, not the
#    ScrollArea's clipped child, and the row gate admits egui 0.31.1's spare
#    row: `rows.end = ceil((offset+vh)/row_height)+1` (egui scroll_area.rs
#    763-772). A caret whose top sits at or below the pane's inner bottom (one
#    scroll step past it) paints over the frame padding and into the search
#    bar row; and with no horizontal clamp, a capture older than a resize
#    carries a cursor.x beyond the narrowed pane — the box paints past the
#    frame border. The old `terminal_cursor_rect` clamps were deleted with no
#    replacement.

state:
  route: "bugfix"
  stage: "review"
  status: "in-progress"
  attempts: "3 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "conditional"
  screen: "approved"

