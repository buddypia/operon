  and the nit was carried per REVIEW.md. Readiness conditional, screen
  approved round 2. Next: commit (gates green: fmt, clippy -D warnings, review
  SHIP), push, CI, merge --no-ff to main, cleanup worktree, package + replace
  /Applications/Operon.app, close."

