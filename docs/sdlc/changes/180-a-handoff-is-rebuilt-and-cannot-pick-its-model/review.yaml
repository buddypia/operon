# Review record for 180-a-handoff-is-rebuilt-and-cannot-pick-its-model.
#
# The change: each handoff destination takes a model and an effort, remembered
# per destination in recent-agent-settings.json and passed through
# build_agent_launch_command; a handoff of a conversation whose transcript is
# unchanged (length and mtime ns) reuses its archive and note; compact handoff
# archives unused for seven days are swept at startup and inside every handoff,
# under one process-wide lock shared with the reuse lookup and the rewrite. The
# handoff notice now survives start_session's generic launch notice.
#
# rust-reviewer: approve-with-nits 0 4
# - Per-frame work: ui_handoff_launch_options and the session list's clone of
#   the handoff map (at most three entries) do no fs, Command, parse, or scan.
# - Panics: no new unwrap, expect, or panic!; the poisoned lock is taken with
#   PoisonError::into_inner and the call site argues why that is safe.
# - i18n: the new tf! rows and the reuse notice have rows in EN_TABLE and
#   KO_TABLE; the card's tr strings already had rows.
# - egui 0.31: ComboBox::from_id_salt, TextEdit::char_limit, on_hover_ui, and
#   selectable_value(..).changed() match 0.31.
#
# durability-reviewer: approve-with-nits 0 3
# - Deletion scope: remove_dir_all reaches only real, UUID-named directories
#   directly under the archive root whose manifest is within 256 KiB and names
#   the compact restore kind and has expired; symlinks (DirEntry::file_type does
#   not follow them), full-history, manifest-less, oversized, and corrupt
#   manifests are kept; store-v2.json and legacy files are untouched.
# - Races: the lock is held from the start of the import to its end, so a sweep
#   on another thread cannot remove a directory whose snapshot is being taken;
#   the fingerprint is taken before the copy, so a transcript that grows during
#   it is snapshotted again next time.
# - CommittedButNotSynced: the rewrites treat every Ok from
#   write_file_atomically as success; bundle before manifest, so a crash between
#   them leaves a new bundle and an old last_used_at, which is harmless.
# - Permissions: 0700 directories and 0600 snapshots unchanged; no new kind of
#   file or directory.

