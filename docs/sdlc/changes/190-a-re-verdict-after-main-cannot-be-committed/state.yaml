# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Bug report (it is the intent on this route): the person's second request for a
# final adversarial review (2026-10-21: "批判的思考と敵対的レビューに基づいて最終検証を
# 行うこと。発見された問題点・改善点は根本的かつ長期運用が可能で…") found change 183
# unable to land. It merged main into its reviewed branch; the merge forced a
# lesson renumber and moved the review digest; the re-verdict at the new digest
# could not be committed — a record-only commit is refused by
# scripts/check-review.sh, amend by the commit guard, reset by the
# destructive-git guard, a new branch by the branch guard — so the only way left
# was a force push of a pushed branch, which went to a person who was away.
#
# Named cause: the record-only refusal reads "a record apart from the code it
# judged describes code that is not there", but does not ask whether the code it
# judged is there: a record whose digest is the branch's diff against main is a
# record of what is there.
#
# Risk: scripts/check-review.sh is gate-configuration (high, paused). The move
# admits one commit the gate refused — a record-only commit whose digest is the
# branch's diff against main and not empty — and nothing else; landing still
# judges its own diff. A paused surface goes to a person, and the person's
# request above is that decision; it is recoverable by a revert.

state:
  route: "bugfix"
  stage: "plan"
  status: "in-progress"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "paused"
  risk: "high"
  readiness: "pending"
  screen: "n/a"

resume: "Plan committed; next the failing test in the_review_gate_refuses_what_it_says_it_refuses."

contract:
  failing-test-first: "machine pending"
  three-gates: "machine pending"
  release-binary: "machine passed no: scripts, src/tests.rs and docs only —
    /Applications/Operon.app is not made stale"
  guards-verified-by-mutation: "human pending"
  review: "human pending"
  lesson-recorded: "machine pending"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
