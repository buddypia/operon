# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Report (the person, 2026-10-21): fix every item left over from 191 and 192
# for good, including the ones that needed a decision. This one: the weekly
# scan is red for quick-xml, and its failures reach no one.
#
# Found (change 192): the dependency audit in scheduled-scan.yml failed on
# 2026-10-12 and 10-19 for RUSTSEC-2026-0194 and -0195 in quick-xml 0.30.0.
# That version arrives only through accesskit_unix → atspi → zbus_xml, Linux
# accessibility, and is not in the tree cargo builds for either Apple target;
# the quick-xml the app builds is 0.41.0, which carries neither advisory.
# `cargo audit` reads all of Cargo.lock, every platform's crates, so the scan
# stays red for a crate the app does not contain, and nothing local ever read
# GitHub's result.
#
# Decided, not asked (AGENTS.md: a recoverable choice is made and recorded):
#   - Not an ignore list. An entry for these two IDs would also hide them the
#     day a dependency starts building quick-xml 0.30 for macOS, and needs
#     removing by hand. The audit is judged by the tree the app is built from
#     instead, so that day it fails with nothing to remove.
#   - Not a dependency bump. zbus_xml pins quick-xml 0.30 through accesskit's
#     Linux backend; moving it means moving eframe's accessibility stack for a
#     platform this app does not ship on.
#   - The failure is told to the next session that starts a change, by `make
#     wt.new`, rather than through an issue the workflow would open on GitHub:
#     that writes to the remote on every red Monday, and the session starting
#     work is the one that can open a change for it.
#
# Fix: scripts/check-audit.sh reads `cargo audit --json` and fails only for a
# vulnerable name@version in `cargo tree` for aarch64- and x86_64-apple-darwin
# (normal and build edges); the rest are listed as not built. An unreadable
# report or a failed `cargo tree` is exit 2, not a pass. scheduled-scan.yml
# exits with its status and puts both lists in the summary.
# scripts/scan-notice.sh asks gh for the last scheduled-scan run, bounded at
# 10s and fail-open, and prints the date and URL to stderr when it failed;
# `make wt.new` runs it after seed-target.sh.
#
# Measured: check-audit.sh on a report with quick-xml 0.30.0 exit 0 (listed as
# not built), with quick-xml 0.41.0 exit 1, not JSON or empty exit 2; under a second
# each. scan-notice.sh against GitHub printed the 2026-10-19 failure and its
# URL.
#
# Risk: .github/workflows and Makefile are the gate-configuration surface —
# high. The audit narrows from every platform's crates to the macOS app's,
# which is what ships; nothing that the app builds is let through.

state:
  route: "bugfix"
  stage: "deploy"
  status: "done"
  attempts: "1 3"
  questions: "0 7"
  autonomy: "supervised"
  risk: "high"
  readiness: "go"
  screen: "n/a"

resume: "Closed. Five remarks are carried in review.yaml; none needs the
  person. Closed in the same commit that CI judges last, so the landing
  waits on one CI run, not two."

contract:
  failing-test-first: "machine passed
    the_weekly_scan_fails_on_what_ships_and_says_so_to_the_next_change red
    for each of seven mutations (the audit never seeing a built crate, an
    unreadable report passing, the shape check removed so an empty report
    passes, the workflow exiting 0, the notice silent on a
    failure, the notice failing offline, wt.new not calling it); an identity
    replacement stayed green as the control"
  three-gates: "machine passed cargo fmt and the named test; clippy at the
    commit; the suite runs in CI"
  ci: "machine passed run 39617308223 at 577f5a7, and again on the tip
    with main (change 194) merged in, which the merge gate checks"
  release-binary: "machine passed no: src/tests.rs only"
  review: "human passed rust-reviewer approve-with-nits 0 3 and
    subprocess-safety-reviewer approve-with-nits 0 2 at 46fa9a70606e4ce8
    (round 2, after both found the empty report passing), remarks carried in
    review.yaml"

sets:
