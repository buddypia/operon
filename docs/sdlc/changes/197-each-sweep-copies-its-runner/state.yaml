# docs/sdlc/templates/state.yaml.
#
# Report (the person, 2026-10-21): fix every item left over from 191 and 192
# for good. This one: how much each change has to write.
#
# Found: docs/sdlc/templates/mutations.py was 350 lines, about 20 of them the
# blocks a change fills in and the rest the runner — atomic restore, signal
# handling, process-group bound, mode carried across. SKILL step 10 says to
# copy it, so 26 change directories hold a copy, 190's at 373 lines and 193's
# at 433, and every review of a change read or skipped the same 330 lines
# again. A fix to the runner reached no sweep already written (the mode fix of
# lesson 043 landed in the template only).
#
# Fix: the runner is scripts/mutation_sweep.py, `main(run_seconds, checks,
# mutations)`. The template is the four blocks and four statements that call
# it from `ROOT / "scripts"`, with bytecode writing off so no __pycache__ is left
# there. SKILL step 10 says where the rules live and that mutating the claim is
# the one no runner keeps. Closed changes keep their copies: each is the record
# of the run its state.yaml reports on. The three tests that run the template
# copy the runner into their fixture (`mutation_sweep_fixture`) and run it
# through the template, as a change does; their assertions are unchanged.
# the_pipeline_documents_ask_their_questions_before_review_does gains a row:
# step 10 names scripts/mutation_sweep.py.
#
# This change's own sweep is written with the new template and ran through the
# new runner: 66 lines, comments included, where the copy would be about 400.
#
# Risk: medium. No application code; the runner is what every later change's
# evidence of its guards comes from, and its behaviour is pinned by the three
# tests above.

