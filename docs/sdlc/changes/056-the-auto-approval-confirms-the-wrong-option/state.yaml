# The state of change 056. The template and the closed sets it is checked
# against live in docs/sdlc/templates/state.yaml.
#
# Numbered 056, and it is the third number this change has had. 049 went to
# another session first, by twenty-six minutes. 053 was then taken twice more
# while this change sat in review — `053-the-suite-is-red-in-a-fresh-checkout`
# and `053-the-terminal-pane-stops-answering-clicks`, in two other worktrees —
# so three directories were numbered 053 at once and only one of them could
# merge under that name. Found by listing every worktree's changes rather than
# this one's, which is the only place the collision is visible: `ls
# docs/sdlc/changes/` in a worktree shows the numbers that worktree knows, and
# every session that picks "the next free number" from its own tree picks the
# same one. Renumbering is cheap here because docs/sdlc/changes is excluded from
# the review digest, so it did not invalidate the verdict in flight — but the
# next session to hit this has no check to hit it with.

state:
  route: "bugfix"
  stage: "test"
  # `blocked` until this line was corrected one commit later. It was true when
  # the file was written — the commit was refused by a gate running in the wrong
  # tree, which is what change 057 exists for — and false by the time the file
  # landed as part of fe03d37. docs/sdlc/README.md:41-46 is explicit that a
  # wrong state file is worse than an absent one, because an absent one is
  # obviously absent and a wrong one is read and believed. Nothing checks this,
  # which is why it survived the commit: no gate compares a change's status
  # against whether its own commit succeeded.
  status: "done"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "supervised"
  risk: "medium"
  readiness: "conditional"
  screen: "n/a"

# The earlier block is lifted. It was never this change's fault: another session
# was editing src/app/screens.rs in the shared working tree and the crate would
# not compile, and change 050 had to land before any commit could pass
# gate-commit.sh. Both are done; this work moved to its own worktree.
resume: "BLOCKED at the commit, with everything else done: reviewed and SHIP at digest 689b611806abe4e9, all three gates green in this tree, the whole change staged. What stops it is not the diff. `.claude/hooks/gate-commit.sh` does `cd \"${CLAUDE_PROJECT_DIR:-.}\"` and this session's CLAUDE_PROJECT_DIR is the main checkout while its working directory is this worktree, so the gate ran `cargo test --locked` in /Users/me/dev/buddypia/operon — another session's uncommitted tree, 22238 lines of src/tests.rs against this one's 19754. Proof rather than inference: three of the 25 tests it reported failing (the_review_gate_refuses_what_it_says_it_refuses, the_commit_gate_installs_the_trampoline_and_refuses_an_empty_one, the_stop_gate_refuses_a_branch_carrying_an_unjudged_commit) do not exist in this tree at all. AGENTS.md's own rule is the answer — work is committed by a session whose project directory is that tree — and this session is not one, so a person has to run the commit from a session rooted at this worktree, or correct this session's project directory. Editing the hook is not the fix available here: gate-configuration is a paused surface in docs/sdlc/risk.yaml.

And it is worse than a refusal, which is why it must not simply be retried. That main-checkout suite is the unfixed one — the repository-pointer fix below is in THIS tree only — so running it under this session's exported GIT_DIR made its git tests operate on this worktree, and it committed the whole staged change onto this branch as `initial`, author `Operon test <test@example.invalid>`, twice: 822f1ae and 34619a7. Both recovered with `git reset --soft 5660ac6`; the second also staged another session's .claude/config.json and .codex/config.toml, unstaged again. Anyone retrying the commit from this session will produce a third. The hazard is general: `cargo test` in the main checkout, from any session that exports GIT_DIR, writes into whichever worktree that variable names.

It grew a second half on the way, and that half is the one to read first: a child process inheriting GIT_DIR meant `current_dir` was not deciding which repository git touched, and the test suite had been committing into this repository while reporting green. Fixed in src/config.rs, src/exec.rs, src/git.rs, src/app.rs — lesson 022, and the departure section of plan.md for how it was found. Two things outlive the change.

One is a finding it made and did not fix: Claude Code's pane carries an OSC 8 hyperlink, and the terminal drawing code in src/ui/terminal.rs knows only CSI, so it paints `]8;id=…;https://…` as visible text — a painting surface, needing a screen approval this change did not have. The other is lesson 021's rule, which is the one to carry: a negative fixture that would fail for some other reason is not testing the branch it is filed under, and the vocabulary that decides whether to act must not be the vocabulary that decides how."

contract:
  three-gates: "machine passed fmt silent, 479 passed 0 failed 6 ignored, clippy silent under both -- -D warnings and --all-targets. Read with GIT_DIR and GIT_WORK_TREE still exported, which is the environment that produced 456 passed 22 failed before the second half of this change existed — running it in a cleaned environment would have hidden exactly what the change fixes"
  no-child-inherits-a-repository: "machine passed the suite reads 479 passed 0 failed with both pointers exported, and the branch is still at 5660ac6 afterwards. Before the fix the same run left an `initial` commit by `Operon test <test@example.invalid>` carrying this change's staged files. Guard: no_git_command_in_the_crate_can_inherit_the_session_repository"
  bands: "machine waived steering_bytes is at its propose tier and always_loaded_bytes at warn (11648, warn at 11000) — both were already over before this change (176972 at 050, 188169 at the commit), and the propose response is a change of its own rather than a reason to leave a lesson unwritten. The 11894 bytes this change adds are lesson 021 and the two paragraphs of plan.md about what the probe does not check; writing less down would have moved the number and not the problem"
  guards-verified-by-mutation: "human passed twenty-four mutations watched, plus two of the script's own failure paths. The review's one nit, fixed rather than recorded: the `//` filter is complete only while production code has no block comments, so a `/* … in INHERITED_REPOSITORY_POINTERS … */` would satisfy the spawn check without dropping anything — the mention hole through the other comment syntax, in the unsafe direction. Closed by an invariant (no `/*` in a production file) and not by a stripper, because the only three `/*` in this crate are inside string literals in the syntax fixtures and a stripper would eat the code between two of them. Watched: a block comment above the CodexAppServer::start loop printed `[\"history.rs\"]`. The one that found the guard wrong: removing the env_remove loop from CodexAppServer::start left the guard green, because it asked whether the file contained the string INHERITED_REPOSITORY_POINTERS and the comment above the deleted loop still said it — a check passing on a mention, which is the hole review found in change 054's wiring test and which this session reproduced after reading about it. The guard now strips `//` lines before counting anything and matches `in INHERITED_REPOSITORY_POINTERS`, the code shape rather than the name; the same mutation then printed `[\"history.rs\"]`. The four for the repository-pointer guard: removing the env_remove loop from run_command_with_output_limit turned it red with `run_command_with_output_limit を通った子プロセスが GIT_DIR を継承しました`, which is the choke point tested by behaviour rather than by reading it; replacing git_command's loop with its own literal pair turned it red on `INHERITED_REPOSITORY_POINTERS を読んでいません`, which is the two-copies failure and not a cosmetic one; adding a tenth raw git Command turned the crate-wide count red with `[(\"git.rs\", 2)]`; and the guard's own first draft, written above the function whose body it reads, matched its own copy of the opening line and failed against correct code — watched, then fixed by moving it below. The six added after review pass two: adding `-S -100` inside tmux_capture_visible_screen — not at the call site, which the first cut of that guard was all it checked — turned the visible-screen guard red; replacing the whitespace collapse in holds_a_trust_question with the screen unchanged turned the wrapped-pane guard red; pinning `step` to `\"Down\"` turned the many-options guard red on its upward case, a branch no test had reached; narrowing a marker to `i trust this folder`, which is a substring of an option rather than equal to one, turned the disjointness guard red; dropping `#`, `%` and ` ` from the three-byte escape set turned the stripper guard red with `%G❯ No, exit`. The four added after pass one: restoring `tmux_capture(name)` in the caller turned the visible-screen guard red; disabling the option ceiling turned the many-options guard red; putting `yes, i trust this folder` back into TRUST_PROMPT_MARKERS turned the disjointness guard red; disabling the `ESC ( B` branch turned the stripper guard red with `(B❯ No, exit`. The script: with `›` removed from TRUST_PROMPT_CURSORS it reported Codex alone unanswerable while Claude and agy stayed green — which is what proves the cursor is sought on an option line and not on Codex's `> You are in …` banner — and probing `sh`, installed and asking nothing, produced `1 silent` and exit 1. The original eight: A fixed [\"Enter\"] turned the Claude pane guard and the end-to-end guard red together, which is the original bug reproduced in two places. A fixed [\"Down\", \"Enter\"] turned the codex/agy guard red. Removing the recognition half turned nothing red at first — all three negative fixtures were screens with no option phrase on them — and turned a_menu_that_is_not_a_trust_prompt_is_never_answered red once a real Codex approval screen was added, which also turned the unmutated code red and is recorded as a defect this change introduced and caught. single_position returning Some(0) instead of None turned the half-drawn guard red. Restoring the awk that matched from the `[` in `[char; 3]` turned the vocabulary round trip red. A capital letter in a phrase and a non-trust phrase in the marker list turned their two guards red. Removing the OSC branch turned the stripper guard red."
  cross-cli-restore: "machine passed with a qualification 3 of 6 passed, including a_saved_codex_conversation_restores_into_a_resumable_claude_terminal, which is the restore this bug broke. The three failures are not this change's and are named in plan.md: two Antigravity-source imports count 5 records where the test expects 4, failing inside import_full_cli_history before a terminal opens, and codex refuses to resume its own rollout file with `missing an ordinal (code -32603)`. Re-run after the second half added src/exec.rs, src/config.rs, src/git.rs and src/app.rs to the diff, because src/exec.rs is on every path there is: the same three passed and the same three failed, by name, so nothing the repository-pointer fix touches changed the restore. The three failing are a_saved_antigravity_conversation_restores_into_a_resumable_claude_terminal, a_saved_antigravity_conversation_restores_into_a_resumable_codex_terminal and codex_app_server_restores_a_short_transcript_into_a_resumable_terminal; src/history.rs, src/transcript.rs and the archive path in src/cli.rs are untouched."
  prompts-still-worded-as-expected: "machine passed bash scripts/check-trust-prompts.sh — `trust prompts: 3 of 3 installed CLIs observed, all still worded as src/tmux.rs expects`. Named for what the script checks: the phrases and glyphs, observed on this machine. Whether a screen is answerable is `workspace_trust_answer_keys`, and the guards over real captured panes are what prove it."
