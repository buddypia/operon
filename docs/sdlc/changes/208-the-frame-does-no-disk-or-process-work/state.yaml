# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/208-the-frame-does-no-disk-or-process-work.
#
# Report: change 202's reading of the open records (triage.md there, A11,
# A12 and A17).
#
# A11. Opening a folder in an editor and copying a checkpoint's diff ran on
#      the frame that drew the menu, up to ten seconds (two five-second
#      command timeouts), and every error was dropped with `let _`.
# A12. Every visible terminal row was split into links on every frame, though
#      a link is only underlined under the pointer; the staged-file selection
#      was rebuilt, from a clone of the whole status, on every frame the
#      changes list was drawn, and the commit box built a sorted list to count
#      it.
# A17. The session menu read `.operon/run.sh`, and the launch form listed and
#      read the templates folder, on the frame that drew them and every two
#      seconds while they stayed open.
#
# Fix: open_in_editor runs the editor as a system action, so its failure is a
# notice, said in Japanese; copy_checkpoint_diff reads the diff on a
# background thread and copies it when it arrives. Both menus loop over
# ExternalEditor::ALL. terminal_row_links reads only the row under the
# pointer and asks for a repaint when it queues a path to probe. The staged
# selection is settled in apply_git_changes; the list borrows the snapshot
# and applies a click after its loop; the commit box counts the set. The run
# script and the templates are read on background threads, again once the
# reading is two seconds old, and shown only for the folder they were read
# from; running the script still reads it again against the digest shown.
#
# Looked at and left: ui_terminal_session_tabs clones the projects and the
# sessions each frame it is drawn, and ui_session_ports collects a session's
# ports. Both are a few dozen small structs, tens of microseconds; taking the
# first clone out means reworking a 650-line drawing function around the
# borrows, which costs more than it saves.

