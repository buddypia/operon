# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml. Branch: fix/207-tests-that-assert-nothing.
#
# Report: change 202's reading of the open records (triage.md there, A13 and
# A19), and what reading them turned up.
#
# A13. Change 077's two tests drew the session list and the ports badge and
#      asserted nothing; change 049's hidden count had no test; one of 049's
#      tests built a session it never read.
# A19. The test build carried two warnings (a loop name no assertion used, a
#      `mut` nothing mutated), and nothing built the tests with warnings
#      denied: the commit gate's clippy does not build them.
# Found here: fifty message ids in both tables that no code shows any more,
#      some of them copies with their newlines escaped twice. The tests checked
#      only that every shown message has a row. Lesson 095.
#
# Fix: the two 077 tests read what they drew (no guide line in the list; one
# port named, two counted, the list kept in the closed menu);
# the_filtered_session_list_says_how_many_it_hides pins 049's count; the idle
# session is the one the test reads. The two warnings are gone, and CI's test
# job builds with RUSTFLAGS -D warnings, pinned by
# ci_runs_on_the_branches_the_merge_gate_asks_about. The fifty rows are gone,
# and every_message_row_is_one_the_code_shows keeps it so.

