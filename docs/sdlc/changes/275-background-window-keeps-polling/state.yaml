# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: modify (the session reading exists; its cadence changes). Risk: low —
# risk.yaml `drawing` (src/app.rs), full autonomy. src/app.rs is a `screen yes`
# surface, so screen.md records that nothing painted changes.

state:
  route: "modify"
  stage: "build"
  status: "in-progress"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Write the five poll_275_ tests, then the constants, the rule and the update wiring, per plan.md."

contract:
  three-gates: "machine pending make q.fast and cargo test --locked poll_275_"
  bands: "machine pending bash scripts/check-bands.sh"
  release-binary: "machine pending required - src/app.rs, src/config.rs and src/util.rs change; package from main after landing"
  guards-verified-by-mutation: "machine pending python3 docs/sdlc/changes/275-background-window-keeps-polling/mutations.py"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
