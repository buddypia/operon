# The state of one change. Field meanings and closed sets:
# docs/sdlc/templates/state.yaml.
#
# Route: modify (the session reading exists; its cadence changes). Risk: low —
# risk.yaml `drawing` (src/app.rs), full autonomy. src/app.rs is a `screen yes`
# surface, so screen.md records that nothing painted changes.

state:
  route: "modify"
  stage: "test"
  status: "done"
  attempts: "0 3"
  questions: "1 7"
  autonomy: "full"
  risk: "low"
  readiness: "go"
  screen: "approved"

resume: "Done. Outlived the change: a window that is visible but not focused also refreshes every six seconds, because egui 0.31 cannot tell it from a hidden one."

contract:
  three-gates: "machine passed make q.fast; cargo test --locked poll_275_ (6) and repaint_loop_; the full suite runs in CI"
  bands: "machine passed bash scripts/check-bands.sh: no tier newly reached; largest_module_lines stays at diagnose (src/app/screens.rs 9978, src/app.rs 9957)"
  release-binary: "machine passed required - src/app.rs, src/config.rs and src/util.rs change; packaged from main with the changes that follow it"
  guards-verified-by-mutation: "machine passed mutations.py 9 of 9 caught; empirical-verifier re-ran every obligation and returned one failing test (a doc comment left on the wrong function), fixed and kept as F1"

sets:
  status: "planning ready in-progress reviewing done awaiting-user blocked failed archived"
  autonomy: "full supervised paused"
  risk: "high medium low"
  readiness: "go conditional no-go pending"
  screen: "approved pending n/a"
  kind: "machine human"
  verdict: "pending passed waived"
