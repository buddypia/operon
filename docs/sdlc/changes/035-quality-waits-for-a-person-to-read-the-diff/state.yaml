resume: "Round 21 returned three do-not-approve verdicts, 1 Important each, and every Important was this change's own fix being incomplete. The rust reviewer showed round 20 closed one spelling of the heredoc class it named: reading the character before << rejects $((1<<X)) only because that character is 1, and shell arithmetic written normally has a space there. The subprocess reviewer, arriving last, added two more shapes (a << in a comment, a backslash-escaped quote) and the reproduction that matters most — this repository's own commit form supplies a heredoc terminator through -m \"$(cat <<EOF ... EOF)\", so one decoy line holding <<EOF swallowed the commit and the hook exited 0; on a fresh clone that is the commit that installs the trampoline, so the gate would never have been installed. It also found the same defect pointing the other way: cat 2<<EOF and cat >f<<EOF are real redirections whose bodies leaked into the command text. The durability reviewer found the exit-3 warning written only to stderr on a path that exits 0, which this hook never surfaces. All fixed: blanked() now does a real left-to-right lex pass (backslashes, both quote kinds, arithmetic with nesting, command substitution re-entering shell context inside quotes, comments, and heredoc terminators copied through) and the operator test reads the whole word in front rather than one character; the unsynced caveat rides every note. Ten shapes measured correct, eight mutations watched red across the round, a hundred and twenty in total. Round 22 is reading digest 36a87b3255e91834 at load 19, told plainly that three of this change's guards were vacuous in one round and to assume the same of these. The owner's stopping rule stands: land if round 22 returns no Importants, treat a self-sabotage-class Important as an accepted exposure in REVIEW.md and have the reviewers judge again, fix anything else, waive nothing. What outlives the change: a directory-less commit on a low-risk file is still ungated by