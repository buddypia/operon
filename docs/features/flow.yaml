    reach: プロジェクト; フォルダを選択…
    note: パスの入力とフォルダの一覧。まだ無いフォルダは確認のうえ作る。

  - id: palette
    title: 検索・操作
    kind: overlay
    screen: palette
    features: palette
    reach: 検索・操作
    image: 05-palette.png

  - id: broadcast
    title: アイドル中のエージェントへ送信
    kind: sheet
    screen: session
