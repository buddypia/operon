# The screen flow of Operon: every screen, sheet and overlay a person reaches,
# and the ways between them.
#
# Written by hand, because egui has no route table, and kept true by
# `screen_flow_reaches_every_page_and_every_way_resolves` and
# `every_navigation_key_is_a_way_in_the_flow` in src/tests.rs, which check it
# against the `Page` and `ProjectTab` enums of src/app.rs, the action ids of
# src/app/keymap.rs and the message ids of src/i18n_tables.rs (change 315).
# Read by scripts/change-map.py for the 画面の流れ view.
#
# Flat on purpose, like index.yaml. Two lists: `screens:` entries open with
# `- id:`, `ways:` entries with `- from:`.
#
# Screens:
#   id        kebab-case
#   title     the screen as the UI names it (Japanese)
#   kind      one of the set below
#   screen    the catalogue screen (docs/features/index.yaml) it is drawn under
#   features  ids of the features shown on it, space separated
#   parent    the screen it sits inside, for drawing only; not a way (optional)
#   page      the `Page` variant it is, when it is one (optional)
#   tab       the `ProjectTab` variant it is, when it is one (optional)
#   image     a file in docs/images/ that shows it (optional)
#   note      one Japanese line (optional)
#   reach     the words to press, `;`-separated, from a fresh launch with the
#             demo project, that bring it up (`-` for none); read by
#             scripts/capture-screens.py, which photographs it (change 316)
#   noshot    instead of `reach`: a Japanese reason it cannot be photographed
#
# Kinds (the test reads this set from here):
#   page     a page of the window (⌘1, ⌘2, ⌘3, ⌘,)
#   tab      a tab inside a page
#   panel    a pane or side panel inside a page
#   sheet    a sheet over the window that a person fills in and closes
#   overlay  a floating layer over the window
#   cli      the command line, outside the window
#
# Ways:
#   from, to  screen ids
#   key       an action id of src/app/keymap.rs that takes it (optional)
#   label     the word on the button or menu item that takes it; part of a
#             Japanese message id (optional)
#   click     what is clicked when the control has no word of its own, such as
#             a row (Japanese; optional). A way has a key, a label, or a click
#   press     the control's name on the picture, when the label alone answers
#             to no control or to two; `words #n` takes the n-th control the
#             words answer to, in the window's reading order (optional)
#   unseen    a Japanese reason the way's control is not on its screen's
#             picture (shown only in some state, or nameless); the way is
#             then taken from the list beside the picture (optional)
#   note      one Japanese line (optional)

screens:

  - id: home
    title: ホーム
    kind: page
    screen: home
    features: home needs-you app-shell
    reach: -
    page: Home
    image: 01-home.png
    note: ツールバーとウィンドウ全体の土台もここから見える。

  - id: projects
    title: プロジェクト
