# The screen flow of Operon: every screen, sheet and overlay a person reaches,
# and the ways between them.
#
# Written by hand, because egui has no route table, and kept true by
# `screen_flow_reaches_every_page_and_every_way_resolves` and
# `every_navigation_key_is_a_way_in_the_flow` in src/tests.rs, which check it
# against the `Page` and `ProjectTab` enums of src/app.rs, the action ids of
# src/app/keymap.rs and the message ids of src/i18n_tables.rs (change 315).
# Read by scripts/change-map.py for the 画面の流れ view.
#
# Flat on purpose, like index.yaml. Two lists: `screens:` entries open with
# `- id:`, `ways:` entries with `- from:`.
#
# Screens:
#   id        kebab-case
#   title     the screen as the UI names it (Japanese)
#   kind      one of the set below
#   screen    the catalogue screen (docs/features/index.yaml) it is drawn under
#   features  ids of the features shown on it, space separated
#   parent    the screen it sits inside, for drawing only; not a way (optional)
#   page      the `Page` variant it is, when it is one (optional)
#   tab       the `ProjectTab` variant it is, when it is one (optional)
#   image     a file in docs/images/ that shows it (optional)
#   note      one Japanese line (optional)
#
# Kinds (the test reads this set from here):
#   page     a page of the window (⌘1, ⌘2, ⌘3, ⌘,)
#   tab      a tab inside a page
#   panel    a pane or side panel inside a page
#   sheet    a sheet over the window that a person fills in and closes
#   overlay  a floating layer over the window
#   cli      the command line, outside the window
#
# Ways:
#   from, to  screen ids
#   key       an action id of src/app/keymap.rs that takes it (optional)
#   label     the word on the button or menu item that takes it; part of a
#             Japanese message id (optional)
#   click     what is clicked when the control has no word of its own, such as
#             a row (Japanese; optional). A way has a key, a label, or a click
#   note      one Japanese line (optional)

screens:

  - id: home
    title: ホーム
    kind: page
    screen: home
    features: home needs-you app-shell
    page: Home
    image: 01-home.png
    note: ツールバーとウィンドウ全体の土台もここから見える。

  - id: projects
    title: プロジェクト
    kind: page
    screen: projects
    features: project-list
    page: Projects
    note: 一覧。フォルダの追加・スキャン・削除。

  - id: project-overview
    title: 概要
    kind: tab
    screen: projects
    features: project-overview
    parent: projects
    tab: Overview

  - id: project-git
    title: 変更
    kind: tab
    screen: projects
    features: git-changes diff-notes
    parent: projects
    tab: Git
    image: 04-diff.png

  - id: project-worktrees
    title: worktree の一覧
    kind: tab
    screen: projects
    features: worktrees
    parent: projects
    tab: Worktrees

  - id: project-prs
    title: PR の一覧
    kind: tab
    screen: projects
    features: git-changes
    parent: projects
    tab: PullRequests

  - id: project-files
    title: ファイル
    kind: tab
    screen: projects
    features: files-editor
    parent: projects
    tab: Files

  - id: project-agent-settings
    title: エージェント設定
    kind: tab
    screen: projects
    features: project-overview
    parent: projects
    tab: AgentSettings

  - id: project-knowledge
    title: ナレッジ
    kind: tab
    screen: projects
    features: knowledge
    parent: projects
    tab: Knowledge

  - id: sessions
    title: セッション
    kind: page
    screen: session
    features: session-column needs-you status-detection session-lifecycle
    page: Sessions
    image: 02-needs-you.png
    note: 左の一覧と、要対応を先頭に固定する行。

  - id: terminal-group
    title: ターミナル
    kind: panel
    screen: session
    features: terminal-pane session-lifecycle
    parent: sessions
    image: 03-session-claude.png
    note: タブと最大 4 分割。

  - id: side-panel
    title: サイドパネル
    kind: panel
    screen: session
    features: terminal-pane
    parent: sessions

  - id: side-files
    title: サイドパネルのファイル
    kind: panel
    screen: session
    features: files-editor
    parent: side-panel

  - id: side-conversation
    title: サイドパネルの会話
    kind: panel
    screen: session
    features: history-handoff
    parent: side-panel

  - id: side-changes
    title: サイドパネルの変更
    kind: panel
    screen: session
    features: git-changes diff-notes
    parent: side-panel

  - id: history-library
    title: 履歴
    kind: panel
    screen: session
    features: history-handoff session-lifecycle session-column
    parent: sessions
    note: 過去の会話の検出と復元、セッションの一覧。

  - id: new-session
    title: 新しいセッション
    kind: sheet
    screen: new-session
    features: new-session
    image: 06-new-session.png

  - id: palette
    title: 検索・操作
    kind: overlay
    screen: palette
    features: palette
    image: 05-palette.png

  - id: broadcast
    title: アイドル中のエージェントへ送信
    kind: sheet
    screen: session
    features: agents-cli

  - id: settings
    title: 設定
    kind: page
    screen: settings
    features: settings
    page: Settings

  - id: settings-appearance
    title: 外観
    kind: panel
    screen: settings
    features: settings
    parent: settings

  - id: settings-agents
    title: エージェント
    kind: panel
    screen: settings
    features: settings status-detection
    parent: settings
    note: 起動に必要なツールと状態の検知方法。

  - id: settings-notifications
    title: 通知
    kind: panel
    screen: settings
    features: settings
    parent: settings

  - id: settings-data
    title: データと復旧
    kind: panel
    screen: settings
    features: local-data settings
    parent: settings

  - id: settings-keys
    title: キー割り当て
    kind: panel
    screen: settings
    features: keybindings
    parent: settings

  - id: cli-agents
    title: Operon agents コマンド
    kind: cli
    screen: cli
    features: agents-cli
    note: セッション内のエージェントが他のセッションを操作する。

  - id: cli-knowledge
    title: Operon knowledge コマンド
    kind: cli
    screen: cli
    features: knowledge
    note: エージェントがナレッジを検索する。

