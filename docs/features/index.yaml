    screen: settings
    domain: shell
    summary: ショートカットの一覧と、keybindings.json による変更。
    paths: src/app/keymap.rs src/app/screens.rs src/app.rs
    keywords: keybinding keymap shortcut keys ショートカット
    manual: 8. キーボードショートカット

  - id: local-data
