name: Scheduled scan

# Runs every Monday on GitHub (the repository has had a remote since this
# header said otherwise; change 192). A failure reaches the next session that
# starts a change: `make wt.new` runs scripts/scan-notice.sh (change 195).

# Stage 6 of docs/sdlc/README.md: a breach that no commit caused is still a
# breach. A deterministic script watches the repository, and what it finds
# re-enters the pipeline at stage 1 as an intent.md — it does not fix anything on
# its own.

on:
  schedule:
    # Mondays, 03:00 UTC. Weekly is the default the playbook recommends and the
    # rate at which a finding is still actionable when it is read.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bands:
    name: control bands
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Metrics, with the gate run timed
        run: bash scripts/harness-metrics.sh --gates | tee metrics.json

      - name: Control bands
        id: check
        continue-on-error: true
        run: bash scripts/check-bands.sh --metrics metrics.json | tee bands.txt

      - name: Summarize
        run: |
          {
            echo '### Control bands'
            echo '```'
            cat bands.txt
            echo '```'
            echo '### Harness metrics'
            echo '```json'
            cat metrics.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.check.outcome }}' = 'failure' ]; then
            echo 'A metric reached its propose threshold. Stage 6 says: write an intent.md under docs/sdlc/changes/ and re-enter the pipeline at stage 1.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  audit:
    name: dependency audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Installed from source rather than through a third-party action, so the
      # only supply chain this job adds is the one it is auditing.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit
        run: |
          cargo audit --json > audit.json || true
          cargo audit | tee audit.txt || true
          # Judged by what the macOS app builds, not by all of Cargo.lock: a
          # Linux-only crate is listed, and does not turn the scan red.
          status=0
          bash scripts/check-audit.sh audit.json > verdict.txt || status=$?
          {
            echo '### Vulnerabilities, by whether the macOS app builds the crate'
            echo '```'
            cat verdict.txt
            echo '```'
            echo '### cargo audit'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat verdict.txt
          # Operon is a local-first desktop app with no network surface of its
          # own, so an advisory is a finding to triage rather than an outage. The
          # job fails so it is seen, and `make wt.new` says so to the next
          # change started (scripts/scan-notice.sh).
          exit "$status"
