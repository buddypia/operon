name: CI

# Stage 4 of docs/sdlc/README.md — CI gates for Operon.
# Remote is active (`origin`), so this workflow runs on pushes to `main` and on pull requests.
# Heavy verification suites (full test suite, package build, and bands) are offloaded to
# parallel jobs on macos-latest runners.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: fmt / clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  test:
    name: test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Full locked test suite
        run: cargo test --locked

  ignored-tests:
    name: cross-cli restore tests
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: brew install tmux || true
      - name: Run ignored tests
        run: cargo test --locked -- --ignored || true

  package:
    name: macos app bundle packaging
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Package macOS app
        run: bash scripts/package-macos.sh --fast

  bands:
    name: control bands and metrics
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Harness metrics
        run: bash scripts/harness-metrics.sh | tee metrics.json
      - name: Control bands
        run: bash scripts/check-bands.sh --metrics metrics.json
