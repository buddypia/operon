name: CI

# Stage 4 of docs/sdlc/README.md — CI gates for Operon.
# This is where `cargo test --locked` runs for a change (change 128): the commit
# gate runs `cargo fmt --check` and `cargo clippy --locked -- -D warnings`
# locally, the branch is pushed, and .claude/hooks/gate-merge.sh refuses the
# merge into main until scripts/ci-verified.sh finds this workflow's `success`
# on the branch head. So it runs on the branches changes are made on, not only
# on main. The workflow file name is what ci-verified.sh asks for.

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

# A newer push of the same branch supersedes the run in flight: the merge gate
# asks about the head, and a run on an older commit is minutes spent on an answer
# nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: fmt / clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  test:
    name: test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Full locked test suite
        run: cargo test --locked

  ignored-tests:
    name: cross-cli restore tests
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: brew install tmux || true
      - name: Run ignored tests
        run: cargo test --locked -- --ignored || true

  package:
    name: macos app bundle packaging
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Package macOS app
        run: bash scripts/package-macos.sh

  bands:
    name: control bands and metrics
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Harness metrics
        run: bash scripts/harness-metrics.sh | tee metrics.json
      - name: Control bands
        run: bash scripts/check-bands.sh --metrics metrics.json
