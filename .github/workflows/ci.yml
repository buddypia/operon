name: CI

# Stage 4 of docs/sdlc/README.md — CI gates for Operon.
# This is where `cargo test --locked` runs for a change (change 128): the commit
# gate runs `cargo fmt --check` and `cargo clippy --locked -- -D warnings`
# locally, the branch is pushed, and .claude/hooks/gate-merge.sh refuses the
# merge into main until scripts/ci-verified.sh finds this workflow's `success`
# on the branch head. So it runs on the branches changes are made on, not only
# on main. The workflow file name is what ci-verified.sh asks for.
#
# Three jobs, each a macOS runner (change 191). A free account runs five macOS
# jobs at once; a landing used to start seven — five here and two in
# harness.yml — so a branch pushed during a landing queued behind it. What
# merged into `checks` needs no build of its own: the band check reads files,
# and the hook checks are `bash -n`. What went: a job running the ignored tests
# with `continue-on-error` and `|| true`, which could not fail and had no agent
# CLI to pass with; AGENTS.md says when to run those, locally.

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'hotfix/**', 'docs/**', 'refactor/**', 'chore/**', 'test/**']
  pull_request:

# A newer push of the same branch supersedes the run in flight: the merge gate
# asks about the head, and a run on an older commit is minutes spent on an answer
# nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# llama-cpp-sys-2 runs CMake on bundled llama.cpp, whose optional cpp-httplib
# calls find_package(OpenSSL). Operon never uses llama.cpp's HTTP transport,
# and caching a Homebrew Cellar path (/opt/homebrew/Cellar/openssl@4/<ver>)
# breaks incremental builds whenever the macOS runner image bumps OpenSSL.
env:
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: ON

jobs:
  checks:
    name: fmt / clippy / bands
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}-no-openssl
      - name: Reset restored native CMake caches
        run: bash scripts/seed-target.sh --reset-only .
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - name: Hook scripts are executable
        run: |
          missing=0
          for hook in .claude/hooks/*.sh; do
            if [ ! -x "$hook" ]; then
              echo "not executable: $hook"
              missing=1
            fi
          done
          exit "$missing"
      - name: Shell syntax
        run: |
          for script in scripts/*.sh .claude/hooks/*.sh; do
            bash -n "$script"
          done
      - name: Harness metrics
        run: |
          bash scripts/harness-metrics.sh | tee metrics.json
          {
            echo '### Harness metrics'
            echo '```json'
            cat metrics.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Control bands
        run: bash scripts/check-bands.sh --metrics metrics.json

  test:
    name: test suite
    runs-on: macos-latest
    # The tests are built with warnings as errors (change 207). The commit
    # gate's clippy does not build them, so two warnings sat in them unread.
    # Set for the job rather than the step, so the cache is keyed on it and
    # the build it restores is the build this step would make.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}-no-openssl
      - name: Reset restored native CMake caches
        run: bash scripts/seed-target.sh --reset-only .
      - name: Full locked test suite
        run: cargo test --locked

  package:
    name: macos app bundle packaging
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}-no-openssl
      - name: Reset restored native CMake caches
        run: bash scripts/seed-target.sh --reset-only .
      - name: Package macOS app
        run: bash scripts/package-macos.sh
