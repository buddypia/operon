name: Harness

# Stage 4 Play 2 of docs/sdlc/README.md: when the thing being changed is the
# steering, the checks that judge steering are what should run.
#
# The eval suite needs an agent, so it runs only where ANTHROPIC_API_KEY is
# configured and is skipped — visibly, with a reason — everywhere else.
#
# The band check, the hook checks and the invariant tests ran here too, in a
# second job that built the crate with no cache on every landing: nine minutes
# for the `cargo test --locked` that ci.yml runs on the same push. ci.yml's
# `checks` and `test` jobs carry all of it now (change 191).

# The two path lists below are deliberately duplicated: GitHub Actions does not
# support YAML anchors, so an alias here would silently match nothing.
on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'REVIEW.md'
      - 'DESIGN.md'
      - 'CONTRIBUTING.md'
      - '.claude/**'
      - 'docs/sdlc/**'
      - 'evals/**'
      - 'scripts/harness-metrics.sh'
      - 'scripts/check-bands.sh'
      - 'scripts/run-evals.sh'
      - '.github/workflows/harness.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'REVIEW.md'
      - 'DESIGN.md'
      - 'CONTRIBUTING.md'
      - '.claude/**'
      - 'docs/sdlc/**'
      - 'evals/**'
      - 'scripts/harness-metrics.sh'
      - 'scripts/check-bands.sh'
      - 'scripts/run-evals.sh'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

jobs:
  evals:
    name: eval suite
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Is an agent available
        id: agent
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped: ANTHROPIC_API_KEY is not configured, so the eval suite did not run. The evals are the only check that judges whether the steering works on a real prompt — see evals/README.md.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: List the evals
        run: bash scripts/run-evals.sh --list

      - name: Install Claude Code
        if: steps.agent.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the evals
        if: steps.agent.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/run-evals.sh --from "$GITHUB_SHA"
